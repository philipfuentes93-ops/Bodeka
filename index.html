<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bodeka · Inventario de bodegas</title>
<meta name="theme-color" content="#0E7C70">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F3F8F7; --panel:#FFFFFF; --ink:#16252A; --muted:#6F8087; --line:#E3EAEA; --field:#F4F8F7; --soft:#F6FAF9;
  --bg1:#EEF7F4; --bg2:#F8F8F4; --bg3:#FFF1E4; --side:#10292C; --side-ink:#D6ECE8; --side-ic:#8FC9BF; --orange:#F28C38;
  --title:#0B4F4A; --thead:#12393B; --accent-strong:#0D5E57;
  --accent:#0E7C70; --accent-soft:#E0F1EE; --tab:#DCEEEA;
  --ok:#17935F; --ok-soft:#E3F5EC; --warn:#C98200; --warn-soft:#FFF2D6; --danger:#DD4236; --danger-soft:#FDE8E6;
  --c1:#2A8CA3; --c2:#7358C9; --c3:#D07A22; --c4:#3E8E47; --c5:#C24D79; --c6:#4A67C8;
  --brand:var(--accent); --link:var(--accent);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1718; --panel:#152124; --ink:#E6F0EE; --muted:#93A8A6; --line:#23363A; --field:#1A292C; --soft:#172528;
    --bg1:#0E1718; --bg2:#101B1D; --bg3:#161816; --side:#0A1C1E; --title:#7FD6C8; --thead:#0D2A2C; --accent-strong:#12877A;
    --accent:#3CC2AE; --accent-soft:#16332F; --tab:#173230;
    --ok:#3DC48A; --ok-soft:#173327; --warn:#F0B43C; --warn-soft:#3A2E14; --danger:#F06B61; --danger-soft:#3D1D1B;
    --c1:#4DB3C9; --c2:#9C85EC; --c3:#EA9C52; --c4:#6CC076; --c5:#E27BA2; --c6:#7F98EA;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1718; --panel:#152124; --ink:#E6F0EE; --muted:#93A8A6; --line:#23363A; --field:#1A292C; --soft:#172528;
  --bg1:#0E1718; --bg2:#101B1D; --bg3:#161816; --side:#0A1C1E; --title:#7FD6C8; --thead:#0D2A2C; --accent-strong:#12877A;
  --accent:#3CC2AE; --accent-soft:#16332F; --tab:#173230;
  --ok:#3DC48A; --ok-soft:#173327; --warn:#F0B43C; --warn-soft:#3A2E14; --danger:#F06B61; --danger-soft:#3D1D1B;
  --c1:#4DB3C9; --c2:#9C85EC; --c3:#EA9C52; --c4:#6CC076; --c5:#E27BA2; --c6:#7F98EA;
}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 "Plus Jakarta Sans","Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}

/* Shell (estilo Ruteka) */
[hidden]{display:none !important}
body{background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%) fixed}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;padding:22px 12px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px}
.bmark{position:relative;width:34px;height:34px;display:grid;place-items:center;font-weight:800;font-size:1.7rem;color:#fff;line-height:1}
.bmark i{position:absolute;right:0;bottom:1px;width:11px;height:11px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 2px var(--side)}
.bname{font-weight:800;font-size:1.65rem;letter-spacing:-.02em;color:#fff}
.gsearch{margin:0 6px 8px;padding:9px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;font-size:.86rem}
.gsearch::placeholder{color:rgba(255,255,255,.5)}
.gsearch:focus{outline:none;border-color:var(--orange)}
.grp{padding:16px 12px 6px;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(214,236,232,.55)}
.nav,.tools{display:flex;flex-direction:column;gap:2px}
.nav button,.tools button,.side-foot .inst{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:12px;cursor:pointer;color:var(--side-ink);font-weight:600;font-size:.95rem;border:1.5px solid transparent;position:relative}
.nav button svg,.tools button svg,.side-foot .inst svg{width:20px;height:20px;flex:none;color:var(--side-ic)}
.nav button:hover,.tools button:hover,.side-foot .inst:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current="page"],.tools button[aria-current="page"]{background:rgba(242,140,56,.10);border-color:var(--orange);color:#fff}
.nav button[aria-current="page"] svg,.tools button[aria-current="page"] svg{color:var(--orange)}
.nav button:focus-visible,.tools button:focus-visible,.side-foot .inst:focus-visible{outline:2px solid var(--orange);outline-offset:1px}
.nav .badge{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:var(--orange);color:#fff;font-size:.72rem;font-weight:800;display:grid;place-items:center;padding:0 6px}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:6px}
.acct{display:flex;align-items:center;gap:10px;padding:8px 8px}
.acct .av{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;flex:none;background-size:cover;background-position:center}
.acct div{min-width:0;flex:1}
.acct b{display:block;color:#fff;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct span:not(.av){display:block;font-size:.76rem;color:rgba(214,236,232,.7);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct button{all:unset;cursor:pointer;color:var(--side-ink);width:32px;height:32px;display:grid;place-items:center;border-radius:8px}
.acct button:hover{background:rgba(255,255,255,.08);color:#fff}
.acct button svg{width:19px;height:19px}
.side-foot .sync{font-size:.72rem;color:rgba(214,236,232,.5);padding:0 12px}
.main{min-width:0;display:flex;flex-direction:column}
.movil-top,.movil-nav{display:none}
.content{padding:30px 34px 60px;max-width:1560px;width:100%}

/* Page head */
.ph,.page-head{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.ph h1,.page-head h1{margin:0 10px 0 0;font-size:1.75rem;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.ph .spacer,.page-head .spacer{flex:1}
.pillsel{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:0 4px 0 12px;font-size:.86rem}
.pillsel span{color:var(--muted)}
.pillsel select{border:0;background:transparent;padding:8px 6px;font-weight:600;max-width:220px}
.pillsel select:focus-visible{outline:none}
.pillsel:focus-within{border-color:var(--accent)}
.qsearch{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:0 10px;min-width:220px}
.qsearch svg{width:16px;height:16px;color:var(--muted);flex:none}
.qsearch input{border:0;background:transparent;padding:8px 0;width:100%}
.qsearch input:focus-visible{outline:none}
.qsearch:focus-within{border-color:var(--accent)}
.addlink{all:unset;cursor:pointer;color:var(--accent);font-weight:700;padding:8px 4px}
.addlink:focus-visible{outline:2px solid var(--accent)}

.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:700;background:var(--ink);color:var(--panel)}
.btn.brand{background:var(--accent-strong);color:#fff}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.sm{padding:7px 12px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:600}
.link:focus-visible{outline:2px solid var(--accent)}
.link.danger{color:var(--danger)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.card-h{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center;gap:12px;flex-wrap:wrap}

/* Folder tabs */
.ftabs{display:flex;gap:6px;flex-wrap:wrap;position:relative;z-index:1}
.ftabs button{border:0;background:var(--tab);color:var(--ink);border-radius:12px 12px 0 0;padding:12px 18px 14px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:-6px}
.ftabs button .ct{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);border-radius:10px;padding:1px 8px;font-size:.76rem;font-weight:700}
.ftabs button[aria-selected="true"]{background:var(--panel);box-shadow:0 -1px 0 var(--line),1px 0 0 var(--line),-1px 0 0 var(--line)}
.ftabs button[aria-selected="true"] .ct{background:var(--accent);color:#fff}
.ftabs + .card{border-top-left-radius:0}

/* Products layout */
.prod-layout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:22px;align-items:start}
.ov{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:18px;position:sticky;top:84px}
.ov-t{margin:0 0 10px;font-size:.78rem;font-weight:700;color:var(--accent)}
.ov-i{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:8px 0 10px}
.ov-i span{display:block;font-size:.84rem;color:var(--muted)}
.ov-i b{display:block;font-size:1.6rem;font-weight:800;line-height:1.2}
.ov-i b.r{color:var(--danger)} .ov-i b.w{color:var(--warn)}
.ov-i:hover span{color:var(--ink)}
.ov-i:focus-visible{outline:2px solid var(--accent);border-radius:6px}
.ov hr{border:0;border-top:1px solid var(--line);margin:12px 0 14px}
.ov-m{list-style:none;margin:0 0 10px;padding:0}
.ov-m li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 0;font-size:.82rem}
.ov-m .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-m .q{font-weight:700;font-variant-numeric:tabular-nums}
.ov-m .pill{min-width:0;padding:1px 6px;font-size:.7rem}
.ov-m.bl li{grid-template-columns:1fr auto;border-bottom:1px solid var(--line)}
.ov-m.bl li:last-child{border-bottom:0}
.bodgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 32px}
.bodgrid .bt{margin:0 0 4px;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.bodgrid .ov-m li{font-size:.9rem;padding:9px 0}
@media (max-width:860px){ .bodgrid{grid-template-columns:1fr;gap:14px} }

/* Table */
.tbl-wrap{overflow:auto}
.pcards{display:none}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.pcard-top{display:flex;align-items:center;gap:10px}
.pcard-top .thumb{flex:none}
.pcard-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pcard-info .rowlink{font-weight:700;text-align:left;white-space:normal}
.pcard-info .sub{font-size:.78rem;color:var(--muted)}
.pcard-mid{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.pcard-mid .stkv{flex:none}
.pcard-mid .mbar{flex:1;min-width:60px}
.pcard-acts{display:flex;gap:6px;margin-top:10px}
.pcard-acts .ib{flex:1;height:36px}
.pcard-exp{margin-top:12px}
table.db{border-collapse:separate;border-spacing:0;width:100%;min-width:860px}
table.db th{position:sticky;top:0;z-index:1;background:var(--field);color:var(--muted);text-align:left;padding:0;font-weight:600;font-size:.8rem;white-space:nowrap;border-bottom:1px solid var(--line)}
table.db th button,table.db th > span{all:unset;display:block;box-sizing:border-box;width:100%;padding:12px 12px;cursor:pointer}
table.db th > span{cursor:default}
table.db th button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
table.db th.n,table.db td.n{text-align:right}
table.db th.c,table.db td.c{text-align:center}
table.db td{padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums;vertical-align:middle}
table.db td.prod{white-space:normal;min-width:280px;font-weight:600}
table.db tbody tr:hover > td{background:var(--soft)}
table.db tr.is-sel > td{background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
table.db tr.is-open > td{background:var(--panel);border-bottom-color:transparent}
table.db td.stk{font-weight:800}
table.db td.neg{color:var(--danger)}
table.db td.cb,table.db th.cb{width:40px;padding-right:0}
table.db input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.thumb{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:.78rem;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 22%,transparent);overflow:hidden}
.thumb img,.bigthumb img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.rowlink{all:unset;cursor:pointer;display:block;font-weight:600}
.rowlink:hover{color:var(--accent)}
.rowlink:focus-visible{outline:2px solid var(--accent)}
.sub{display:block;font-size:.78rem;font-weight:400;color:var(--muted);margin-top:1px}
.catpill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:.8rem;font-weight:600}
.catpill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.stkv b{font-size:1rem;font-weight:800}
.stkv span{color:var(--muted);font-size:.8rem;margin-left:3px}
.mbar{width:84px;height:4px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.mbar.min i{background:var(--warn)} .mbar.crit i{background:var(--danger)}
.pill{display:inline-block;min-width:84px;text-align:center;font-size:.76rem;font-weight:700;padding:4px 10px;border-radius:6px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.min{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--danger-soft);color:var(--danger)}
.pill.venc{background:var(--danger-soft);color:var(--danger)}
.pill.pv{background:var(--warn-soft);color:var(--warn)}
.pill.vig{background:transparent;color:var(--muted);min-width:0;padding:0}
.pill.in{background:var(--ok-soft);color:var(--ok)}
.pill.out{background:var(--danger-soft);color:var(--danger)}
.pill.adj{background:var(--accent-soft);color:var(--accent)}
.vd{font-size:.78rem;display:block}
.acts{display:flex;gap:6px;justify-content:flex-end}
.ib{width:30px;height:30px;border-radius:8px;border:0;display:grid;place-items:center;font-weight:800;font-size:1rem;background:var(--field);color:var(--muted)}
.ib svg{width:16px;height:16px}
.ib.in{background:var(--ok-soft);color:var(--ok)} .ib.out{background:var(--danger-soft);color:var(--danger)}
.ib.exp{background:var(--accent-soft);color:var(--accent)}
.ib.exp[aria-expanded="true"] svg{transform:rotate(180deg)}
.kebab{border:0;background:transparent;border-radius:8px;width:30px;height:30px;font-size:1.2rem;line-height:1;color:var(--muted)}
.kebab:hover{background:var(--field);color:var(--ink)}

/* Expanded row */
tr.exp > td{padding:0 12px 14px !important;background:var(--panel) !important}
.expbox{border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,30,60,.08);background:var(--panel)}
.exp-in{display:grid;grid-template-columns:190px minmax(0,1fr) 260px;gap:26px;padding:20px 22px 12px}
.exp-media{display:flex;flex-direction:column;align-items:center;gap:12px}
.bigthumb{width:150px;height:120px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;background:color-mix(in srgb,var(--c) 10%,var(--panel));color:var(--c);font-size:2rem;font-weight:800;overflow:hidden;position:relative}
.bigthumb .fotoedit{all:unset;box-sizing:border-box;position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.55);color:#fff;text-align:center;font-size:.68rem;font-weight:600;padding:4px 0;cursor:pointer}
.bigstock{text-align:center}
.bigstock b{font-size:1.6rem;font-weight:800}
.bigstock span{display:block;color:var(--muted);font-size:.8rem}
.exp-btns{display:flex;flex-direction:column;gap:6px;width:100%}
.exp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 22px;align-content:start}
.exp-grid .wide{grid-column:span 2}
.uf label{display:block;font-size:.76rem;color:var(--muted);margin-bottom:2px}
.uf input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:6px 0;font-weight:600;white-space:normal}
.uf input:focus{outline:none;border-bottom-color:var(--accent)}
.exp-hist p{margin:0 0 8px;font-size:.78rem;color:var(--muted)}
.exp-hist ul{list-style:none;margin:0;padding:0}
.exp-hist li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:.82rem;white-space:normal}
.exp-hist li:last-child{border-bottom:0}
.exp-hist .pill{min-width:0;padding:1px 7px;font-size:.7rem}
.exp-foot{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:10px 22px;font-size:.82rem}
.exp-foot .spacer{flex:1}
.saved{color:var(--muted)} .saved.ok{color:var(--ok);font-weight:600}

/* Bulk + pager */
.bulk{position:sticky;bottom:0;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap;border-radius:0 0 14px 14px}
.bulk .spacer{flex:1}
.pager{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.pager .spacer{flex:1}
.pager select{padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.pages{display:flex;gap:4px}
.pages button{width:32px;height:30px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:0}
.pages button:disabled{opacity:.4;cursor:default}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.note{margin-top:10px;font-size:.84rem;color:var(--muted)}

/* Filters (docs & movements) */
.filters{padding:14px 16px;margin-bottom:14px}
.fgrid{display:grid;grid-template-columns:1fr;gap:10px}
.fbox{position:relative}
.fbox label{position:absolute;top:-8px;left:10px;background:var(--panel);padding:0 4px;font-size:.72rem;color:var(--muted)}
.fbox input,.fbox select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}

/* Home */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:22px}
.summary button{all:unset;cursor:pointer;padding:18px 16px;border-right:1px solid var(--line)}
.summary button:last-child{border-right:0}
.summary button:hover{background:var(--soft)}
.summary button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.summary .big{display:block;font-size:1.9rem;font-weight:800;line-height:1.15;color:var(--c,var(--ink))}
.summary .sm{font-size:.84rem;color:var(--muted)}
.sec-t{font-weight:700;margin:0 0 10px;font-size:1rem}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.cat-tile{border:1px solid var(--line);border-radius:14px;background:var(--panel);min-height:92px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:12px;font-weight:700;font-size:1rem}
.cat-tile::before{content:"";width:30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--c) 18%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.cat-tile:hover{border-color:var(--c)}
.inv-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px;align-items:start}
.donut-card{padding:18px 20px;height:100%}
.donut-card h3{margin:0 0 10px;font-size:.95rem}
.donut{display:block;margin:6px auto 12px}
.legend{list-style:none;margin:0;padding:0}
.legend li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.legend li:last-child{border-bottom:0}
.legend .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.legend .v{margin-left:auto;color:var(--muted)}
.quick{display:flex;gap:8px;flex-wrap:wrap}


/* ===== Dashboard ===== */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.dash > *{min-width:0}
.span-8{grid-column:span 8}.span-4{grid-column:span 4}.span-12{grid-column:1/-1}.span-6{grid-column:span 6}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:26px 28px;color:#fff;
  background:radial-gradient(120% 140% at 100% 0%,#8B6CF6 0%,transparent 55%),linear-gradient(120deg,#2F5BEA 0%,#4C46E0 55%,#6D3FD8 100%);min-height:210px;display:flex;flex-direction:column;justify-content:space-between;gap:18px}
.hero .hi{font-size:.9rem;opacity:.85;margin:0}
.hero h2{margin:4px 0 0;font-size:1.65rem;font-weight:800;letter-spacing:-.01em;line-height:1.2;max-width:520px}
.hero-stats{display:flex;gap:28px;flex-wrap:wrap}
.hero-stats div b{display:block;font-size:1.6rem;font-weight:800;line-height:1.1}
.hero-stats div span{font-size:.8rem;opacity:.8}
.hero-acts{display:flex;gap:8px;flex-wrap:wrap}
.hero-acts button{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:#fff;color:#3548D6}
.hero-acts button.alt{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.hero-acts button:hover{filter:brightness(.96)}
.hero-art{position:absolute;right:18px;bottom:-6px;width:250px;height:190px;opacity:.95;pointer-events:none}
.health{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.health h3,.dcard h3{margin:0;font-size:.98rem;font-weight:700;display:flex;align-items:center;gap:8px}
.health h3 .muted,.dcard h3 .muted{font-weight:500;font-size:.8rem;margin-left:auto}
.health-body{display:flex;align-items:center;gap:20px}
.ring{flex:none}
.hl-list{flex:1;display:flex;flex-direction:column;gap:10px}
.hl-row{display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-size:.84rem}
.hl-row b{font-weight:700}
.hl-bar{grid-column:1/-1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.hl-bar i{display:block;height:100%;border-radius:4px;background:var(--c)}
.kpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:14px;transition:border-color .15s,transform .15s}
.kpi:hover{border-color:var(--c);transform:translateY(-1px)}
.kpi:focus-visible{outline:2px solid var(--accent)}
.kpi .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--panel))}
.kpi .ic svg{width:22px;height:22px}
.kpi b{display:block;font-size:1.55rem;font-weight:800;line-height:1.1}
.kpi span{font-size:.8rem;color:var(--muted)}
.dcard{padding:18px 20px}
.dcard h3{margin-bottom:12px}
.cats2{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.cat2{all:unset;box-sizing:border-box;cursor:pointer;position:relative;overflow:hidden;border-radius:14px;padding:16px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 16%,var(--panel)) 0%,var(--panel) 75%);border:1px solid color-mix(in srgb,var(--c) 25%,var(--line))}
.cat2::after{content:"";position:absolute;right:-26px;bottom:-26px;width:90px;height:90px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,transparent)}
.cat2 .ci{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:.8rem;color:#fff;background:var(--c);box-shadow:0 6px 14px color-mix(in srgb,var(--c) 35%,transparent)}
.cat2 .cn{font-weight:700;font-size:.98rem;position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:8px}
.cat2 .cn svg{width:16px;height:16px;color:var(--muted);flex:none}
.cat2:hover{border-color:var(--c)} .cat2:hover .cn svg{color:var(--c)}
.cat2:focus-visible{outline:2px solid var(--accent)}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:0}
.plist .nm{font-weight:600;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .sb{font-size:.76rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.plist .mb{width:70px;height:4px;border-radius:3px;background:var(--line);overflow:hidden;display:inline-block}
.plist .mb i{display:block;height:100%;background:var(--c)}
.plist .rt{text-align:right;font-size:.76rem;color:var(--muted)}
.plist .rt b{display:block;font-size:.95rem;color:var(--ink)}
.plist .thumb{width:36px;height:36px}
.dcard .more{display:block;margin-top:10px;font-size:.84rem}
.today{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tbox{border-radius:14px;padding:14px;background:color-mix(in srgb,var(--c) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 20%,var(--line))}
.tbox span{font-size:.78rem;color:var(--muted);display:block}
.tbox b{font-size:1.45rem;font-weight:800;color:var(--c)}
.tbox small{display:block;font-size:.76rem;color:var(--muted)}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.feed li:last-child{border-bottom:0}
.feed .fi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--panel))}
.feed .nm{font-weight:600;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed .sb{font-size:.76rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed .q{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.feed .q small{display:block;font-weight:500;font-size:.72rem;color:var(--muted)}
.mini-empty{color:var(--muted);font-size:.86rem;padding:14px 0}
@media (max-width:1250px){ .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} .span-8,.span-4,.span-6{grid-column:1/-1} }
@media (max-width:760px){ .kpis{grid-template-columns:1fr 1fr} .hero-art{display:none} .health-body{flex-direction:column;align-items:stretch} .ring{align-self:center} }
@media (prefers-reduced-motion:reduce){ .kpi{transition:none} .kpi:hover{transform:none} }

/* Login */
.login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:radial-gradient(90% 120% at 100% 0%,rgba(242,140,56,.45) 0%,transparent 55%),linear-gradient(120deg,#0F7C70 0%,#0D5E57 60%,#0B3F3D 100%)}
.login[hidden]{display:none}
.login-card{background:var(--panel);border-radius:18px;padding:32px 28px;width:min(400px,100%);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.login-card .bmark{margin:0 auto 16px;width:52px;height:52px;border-radius:14px;background:var(--accent-strong);font-size:2rem}
.login-card h1{margin:0 0 6px;font-size:1.4rem;font-weight:800;color:var(--title)}
.login-card p{margin:0 0 20px;color:var(--muted)}
.login-card input{width:100%;box-sizing:border-box;padding:11px 12px;margin-bottom:10px;border:1px solid var(--line);border-radius:8px;background:var(--field);font-size:.95rem}
.login-card input:focus{outline:none;border-color:var(--accent)}
.login-card .login-btns{display:flex;align-items:center;gap:6px;margin-top:4px}
.login-card .btn{padding:12px;flex:1}
.login-card .login-btns .link{white-space:nowrap;font-size:.82rem;font-weight:600;padding:8px}
.login-card .err{margin:14px 0 0;color:var(--danger);min-height:0}
/* Document form */
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 12px;padding:20px 18px 8px}
.form-grid .wide{grid-column:span 2}
.pick-wrap{position:relative;flex:1;max-width:520px;font-weight:400}
.pick-wrap input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--field)}
.sugs{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(20,30,60,.14);padding:4px;display:none;max-height:320px;overflow:auto}
.sugs.open{display:block}
.sugs button{display:flex;width:100%;gap:10px;align-items:baseline;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px}
.sugs button:hover,.sugs button:focus-visible,.sugs button.hl{background:var(--field);outline:none}
.sugs .sc{color:var(--muted);font-size:.8rem;margin-left:auto;white-space:nowrap}
.lines input{width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);text-align:right}
.lines input[type=date]{width:150px;text-align:left}
.lines input.bad{border-color:var(--danger);color:var(--danger)}
.rm{border:0;background:transparent;color:var(--muted);font-size:1.05rem;border-radius:6px;width:30px;height:30px}
.rm:hover{background:var(--field);color:var(--danger)}
.form-foot{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.form-foot .spacer{flex:1}
.ferr{color:var(--danger);font-weight:600;margin:10px 0 0}
#dDoc{width:min(820px,calc(100% - 24px))}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 16px;margin:10px 0 16px}
.kv div{font-size:.88rem} .kv span{display:block;color:var(--muted);font-size:.76rem}
#dMov .seg{display:none}

.pop{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(20,30,60,.16);padding:4px;min-width:170px;display:none}
.pop.open{display:block}
.pop button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 12px;border-radius:6px}
.pop button:hover,.pop button:focus-visible{background:var(--field);outline:none}

@media (max-width:1250px){ .exp-in{grid-template-columns:170px minmax(0,1fr)} .exp-hist{grid-column:1/-1} }
@media (max-width:1100px){ .inv-grid{grid-template-columns:1fr} }
@media (max-width:1560px){ .prod-layout{grid-template-columns:1fr} .prod-layout > .ov{order:-1;position:static;display:flex;flex-wrap:wrap;align-items:center;gap:6px 28px;padding:12px 20px}
  .prod-layout > .ov .ov-i{width:auto;padding:4px 0} .prod-layout > .ov .ov-i b{font-size:1.25rem} .prod-layout > .ov hr,.prod-layout > .ov .ov-m,.prod-layout > .ov > .link,.prod-layout > .ov > .ov-t:not(:first-child),.prod-layout > .ov > p.muted{display:none} .prod-layout > .ov > .ov-t{margin:0 8px 0 0} }
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .scrim{display:none !important}
  .movil-top{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20;background:var(--side);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .movil-top .bname{display:flex;align-items:center;gap:8px;font-size:1.3rem;font-weight:800;letter-spacing:-.02em;color:#fff}
  .movil-top .bmark{width:28px;height:28px;font-size:1.15rem}
  .movil-avatar{all:unset;box-sizing:border-box;cursor:pointer;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.82rem;background-size:cover;background-position:center;flex:none}
  .content{padding:16px 12px calc(82px + env(safe-area-inset-bottom,0px))}
  .movil-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding:5px 2px calc(5px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(10,20,25,.08)}
  .movil-tab{all:unset;box-sizing:border-box;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;cursor:pointer;color:var(--muted);font-size:.66rem;font-weight:600;text-align:center}
  .movil-tab svg{width:22px;height:22px}
  .movil-tab.activa{color:var(--accent-strong)}
  .movil-tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:8px}
  .form-grid,.exp-grid{grid-template-columns:1fr} .form-grid .wide,.exp-grid .wide{grid-column:auto}
  .exp-in{grid-template-columns:1fr} .kv{grid-template-columns:1fr 1fr}
  .qsearch{min-width:0;flex:1}
  .prod-tbl{display:none}
  .pcards{display:block}
}
.movil-sheet{position:fixed;inset:0;z-index:45;display:flex;align-items:flex-end}
.movil-sheet[hidden]{display:none}
.movil-sheet-fondo{position:absolute;inset:0;background:rgba(5,20,20,.45)}
.movil-sheet-panel{position:relative;width:100%;background:var(--panel);border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto}
.movil-sheet-asa{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.movil-sheet-cuenta{display:flex;align-items:center;gap:12px;padding:4px 4px 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.movil-avatar-lg{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.05rem;flex:none;background-size:cover;background-position:center}
.movil-sheet-nombre{font-weight:800;font-size:1rem}
.movil-sheet-email{font-size:.8rem;color:var(--muted);word-break:break-all}
.movil-sheet-item{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:14px;width:100%;min-height:50px;border-radius:12px;padding:8px 8px;font-size:.95rem;font-weight:600;color:var(--ink);cursor:pointer}
.movil-sheet-item:hover{background:var(--field)}
.movil-sheet-item svg{width:22px;height:22px;color:var(--accent-strong);flex:none}
.movil-sheet-item.salir,.movil-sheet-item.salir svg{color:var(--danger)}
dialog{border:0;border-radius:14px;padding:0;width:min(500px,calc(100% - 24px));background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,25,.55)}
.dlg{padding:20px;max-height:calc(100vh - 40px);overflow:auto}
.dlg h2{margin:0 0 4px;font-size:1.5rem;line-height:1.15}
.dlg .sub{color:var(--muted);margin:0 0 14px;font-size:.9rem}
.fotobox{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.fotoprev{width:76px;height:76px;border-radius:12px;background:var(--field);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:none;overflow:hidden}
.fotoprev svg{width:28px;height:28px}
.fotoprev img{width:100%;height:100%;object-fit:cover;display:block}
.fotoacts{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0}
.f label{font-size:.85rem;color:var(--muted)}
.f input,.f select{padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--field);width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.seg,.locseg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.seg button,.locseg button{border:1px solid var(--line);background:var(--field);border-radius:6px;padding:9px;font-weight:600}
.seg button[aria-pressed="true"],.locseg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.preview{background:var(--field);border-radius:6px;padding:10px 12px;margin-bottom:14px;font-size:.95rem;line-height:1.6}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg-actions .spacer{flex:1}
.err{color:var(--danger);font-size:.88rem;min-height:1.2em;margin:0 0 8px}
.bar{height:8px;background:var(--field);border-radius:4px;overflow:hidden;margin:6px 0 10px}

/* Ruteka family accents */
.ph h1,.page-head h1{color:var(--title)}
table.db th{background:var(--thead);color:#fff;text-transform:uppercase;font-size:.72rem;letter-spacing:.05em;font-weight:800;border-bottom:0}

table.db thead th:last-child{border-top-right-radius:14px}
.card{border-radius:16px}
.hero{background:radial-gradient(90% 120% at 100% 0%,rgba(242,140,56,.45) 0%,transparent 55%),linear-gradient(120deg,#0F7C70 0%,#0D5E57 60%,#0B3F3D 100%)}
.hero-acts button{color:#0D5E57}

.kpi:hover{border:0;filter:brightness(1.05)}

.kpi span{color:rgba(255,255,255,.9)}

.kpi b{color:#fff}

.btn.brand{background:var(--accent-strong)}

/* Picking gráfico */
.seg{display:inline-flex;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.pk-flow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.7fr);gap:18px;align-items:center}
.pk-lbl{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.pk-cards{display:flex;gap:10px;flex-wrap:wrap}
.pk-bod{all:unset;box-sizing:border-box;cursor:pointer;flex:1 1 130px;min-width:120px;display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--panel);position:relative;transition:border-color .15s,box-shadow .15s,background .15s}
.pk-bod:hover{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.pk-bod:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pk-bod.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 11%,var(--panel));box-shadow:0 6px 18px color-mix(in srgb,var(--c) 22%,transparent)}
.pk-bod.on::after{content:"✓";position:absolute;top:8px;right:12px;color:var(--c);font-weight:800}
.pk-bod b{font-size:1.2rem;font-weight:800}
.pk-bod small{color:var(--muted)}

.pk-sub{display:flex;gap:10px;align-items:center;font-size:.76rem;color:var(--muted)}
.pk-foot{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;background:var(--panel);border-top:1px solid var(--line);border-radius:0 0 16px 16px;box-shadow:0 -6px 14px rgba(10,20,25,.05)}

.pk-filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.pk-filters .spacer{flex:1}
.pk-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.pk-kpi{border-radius:14px;padding:14px 16px;color:#fff;background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 72%,#000));box-shadow:0 8px 20px color-mix(in srgb,var(--c) 25%,transparent)}
.pk-kpi b{display:block;font-size:1.7rem;font-weight:800;line-height:1.1}
.pk-kpi span{font-size:.7rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;opacity:.92}
.pk-h{margin:4px 0 10px;font-size:.98rem;font-weight:700}
.pk-chart{display:flex;align-items:stretch;gap:10px;height:210px;padding-top:4px}
.pk-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.pk-bar{flex:1;width:100%;max-width:70px;display:flex;flex-direction:column-reverse;border-radius:8px 8px 3px 3px;overflow:hidden;background:var(--field)}
.pk-col:only-child .pk-bar{max-width:140px}
.pk-bar i{display:block;width:100%}
.pk-cv{font-size:.78rem;font-weight:800;min-height:1.1em}
.pk-cl{font-size:.78rem;color:var(--muted);font-weight:600}
.pk-col.hoy .pk-cl{color:var(--accent);font-weight:800}
.pk-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:.84rem}
.pk-legend span{display:inline-flex;align-items:center;gap:6px}
.pk-mini{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);opacity:.55;border-radius:3px}
.pk-docs{padding:0}
.pk-doc{border-bottom:1px solid var(--line);border-left:4px solid var(--c)}
.pk-doc:last-child{border-bottom:0}
.pk-doc summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 18px;cursor:pointer;flex-wrap:wrap}
.pk-doc summary::-webkit-details-marker{display:none}
.pk-doc summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.pk-doc[open] summary::before{transform:rotate(90deg)}
.pk-doc summary .spacer{flex:1}
.pk-folio{font-weight:800}
.pk-ruta i{font-style:normal;color:var(--muted)}
.pk-chip{background:var(--field);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.78rem;color:var(--muted)}

@media (max-width:860px){

}
.pk-gen{background:linear-gradient(135deg,var(--accent-soft),var(--panel))}
.pk-gqty{align-items:stretch}
.pk-grid{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.pk-g{display:flex;flex-direction:column;gap:3px;align-items:center;border-top:3px solid var(--c);padding-top:4px}

.pk-step.sm button{width:30px;height:38px}
.pk-step.sm input{width:50px;height:38px;font-size:.98rem}
.pk-gqty .pk-sub{justify-content:flex-end}
@media (max-width:860px){ .pk-grid{justify-content:space-between;width:100%} .pk-g{flex:1;min-width:0} .pk-step.sm button{width:26px} .pk-step.sm input{width:100%;min-width:0} .pk-step.sm{width:100%} .pk-gqty .pk-sub{justify-content:space-between} .pk-qty.pk-gqty{flex-direction:column;align-items:stretch} }

<script>
const DEFAULT_CATS = ["Bebidas","Aseo","Cafetería"];
const PALETTE = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];
const LEGACY = {bebidas:"Bebidas", aseo:"Aseo", snack:"Cafetería"};
const BODEGAS_DEFAULT = [
  {id:"repo", nombre:"Reposición", tipo:"reposicion", activa:true},
  {id:"p14", nombre:"Tránsito Piso 14", tipo:"picking", activa:true},
  {id:"p11", nombre:"Tránsito Piso 11", tipo:"picking", activa:true}
];
const COOLERS_DEFAULT = [
  {id:"c10", nombre:"Coolers Piso 10", tipo:"cooler", activa:true},
  {id:"c11", nombre:"Coolers Piso 11", tipo:"cooler", activa:true},
  {id:"c14", nombre:"Cooler Piso 14", tipo:"cooler", activa:true}
];
const COOLERS_ANTES = {c10:"Cooler Piso 10", c11:"Cooler Piso 11", c14:"Cooler Piso 14", p14:"Piso 14", p11:"Piso 11"};
// Bodegas creadas antes de existir el tipo "cooler": se agregan los 3 coolers una sola vez.
// También renombra a los nombres actuales las que conservan su nombre original (coolers y tránsito).
function conCoolers(list){
  const cambios=[];
  list=list.map(b=>{ const d=[...COOLERS_DEFAULT,...BODEGAS_DEFAULT].find(c=>c.id===b.id);
    if(d && d.tipo!=="reposicion" && b.tipo===d.tipo && b.nombre===COOLERS_ANTES[b.id] && b.nombre!==d.nombre){ const nb={...b,nombre:d.nombre}; cambios.push(nb); return nb; } return b; });
  if(list.some(b=>b.tipo==="cooler")) return {list, nuevos:cambios};
  const nuevos=COOLERS_DEFAULT.filter(c=>!list.some(b=>b.id===c.id)).map(b=>({...b}));
  return {list:[...list,...nuevos], nuevos:[...cambios,...nuevos]};
}
const ADMINS = ["philip.fuentes93@gmail.com","pfuentesarroyo@coca-cola.com"];
let esAdmin = true;   // en modo local (sin Firebase) no hay otros usuarios; con Firebase se ajusta al iniciar sesión
const bods = tipo => S.bodegas.filter(b=>b.activa!==false && (!tipo || b.tipo===tipo));
const PK_GEN = "*";   // destino "General": un picking repartido a todos los coolers
const bodNom = id => id===PK_GEN ? "General (todos los coolers)" : (S.bodegas.find(b=>b.id===id)||{}).nombre || id;
const S = {tab:"todos", sel:new Set(), open:null, saved:null, productos:[], movs:[], docs:[], bodegas:[...BODEGAS_DEFAULT,...COOLERS_DEFAULT], form:null, dq:"", screen:"home", cat:"todas", modo:"stock", q:"", cod:"", bod:"todas", st:"todos", ev:"todos", sort:{k:"nombre",dir:1}, page:1, size:25, mq:"", pkOrig:"repo", pkUbic:"p14", pkLineas:[], pkq:"", pkErr:"", pkTab:"nuevo", pkRango:"hoy", pkDestF:"todas", bfNombre:"", bfTipo:"picking", bfErr:""};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n||0).toLocaleString("es-CL",{maximumFractionDigits:2});
const clp = n => "$ " + Math.round(Number(n)||0).toLocaleString("es-CL");
const norm = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const idFromCode = c => "p-" + String(c).replace(/[^A-Za-z0-9_\-.~:@+]/g,"").slice(0,60);
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2400)}
function parseNum(v){
  if(typeof v==="number") return v;
  let s=String(v??"").replace(/[$\s]/g,""); if(!s||s==="-") return 0;
  if(/,\d{1,2}$/.test(s)) s=s.replace(/\./g,"").replace(",","."); else s=s.replace(/[.,](?=\d{3}(\D|$))/g,"");
  const n=parseFloat(s); return isNaN(n)?0:n;
}
function fixProd(p){
  const q = {...p};
  if(!q.categoria && LEGACY[q.bodega]){ q.categoria = LEGACY[q.bodega]; q.bodega=""; }
  q.unidad = q.unidad||"UN"; q.vencimiento = q.vencimiento||""; q.minimo = +q.minimo||0; q.foto = q.foto||"";
  q.packUn = Math.max(1, +q.packUn || 1);
  // Migración: productos antiguos solo tenían un stock global, no por bodega.
  // Se asume que ese stock vivía todo en la bodega de reposición por defecto, sin perder unidades.
  q.ubic = q.ubic ? {...q.ubic} : {repo:+q.stock||0};
  Object.keys(q.ubic).forEach(k=>{ q.ubic[k]=+q.ubic[k]||0; });
  q.stock = Object.values(q.ubic).reduce((a,n)=>a+n,0);
  return q;
}
/* ---------- Fotos de producto ---------- */
function leerFotoComprimida(file, maxDim, quality){
  maxDim = maxDim||640; quality = quality||.72;
  return new Promise((resolve,reject)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      const r = Math.min(1, maxDim/Math.max(img.width,img.height));
      const w = Math.max(1,Math.round(img.width*r)), h = Math.max(1,Math.round(img.height*r));
      const cv = document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      let q = quality, out = cv.toDataURL("image/jpeg", q);
      while(out.length > 700000 && q > 0.35){ q -= 0.12; out = cv.toDataURL("image/jpeg", q); }
      resolve(out);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("No se pudo leer la imagen.")); };
    img.src = url;
  });
}
function thumbHtml(p){
  return p.foto ? `<img src="${p.foto}" alt="" loading="lazy">` : esc(ini(p.categoria));
}

/* ---------- Categories (dynamic, accent-insensitive) ---------- */
function cats(){
  const out=[], seen=new Set();
  (S.productos.length ? S.productos.map(p=>p.categoria) : DEFAULT_CATS).forEach(c=>{ if(c && !seen.has(norm(c))){seen.add(norm(c)); out.push(c);} });
  return out;
}
const catColor = c => PALETTE[Math.max(0,cats().findIndex(x=>norm(x)===norm(c))) % PALETTE.length];
const bodegas = () => [...new Set(S.productos.map(p=>p.bodega).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es"));

/* ---------- Storage ---------- */
// Firestore queues writes offline and syncs later, so we don't block the UI waiting for the server.
const syncErr = e => toast(e && e.code==="permission-denied" ? "Tu cuenta no tiene permiso para guardar cambios." : "Un cambio no se pudo sincronizar. Revisa tu conexión.");
const Store = {
  db:null,
  local(){ try{ return {productos:[],movs:[],docs:[],bodegas:[], ...JSON.parse(localStorage.getItem("inv-bodegas")||"{}")} }catch{ return {productos:[],movs:[],docs:[],bodegas:[]} } },
  saveLocal(){ try{ localStorage.setItem("inv-bodegas", JSON.stringify({productos:S.productos, movs:S.movs.slice(0,500), docs:S.docs.slice(0,500), bodegas:S.bodegas})) }catch{} },
  async init(){
    const l=this.local(); S.productos=l.productos.map(fixProd); S.movs=l.movs; S.docs=l.docs;
    S.bodegas = conCoolers(l.bodegas && l.bodegas.length ? l.bodegas : [...BODEGAS_DEFAULT]).list;
    // Standalone download (replaces the claude.ai downloads capability)
    this.dl={ async save({filename,data}){ const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data])); const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); } };
    $("#expBtn").hidden=false;
    const cfg=window.FIREBASE_CONFIG;
    if(!window.firebase || !cfg || !cfg.apiKey || /PEGAR/i.test(cfg.apiKey)){
      $("#sync").textContent="Modo local (sin Firebase)"; render(false); return;
    }
    firebase.initializeApp(cfg);
    const db=firebase.firestore();
    try{ await db.enablePersistence({synchronizeTabs:true}); }catch{}   // works offline inside the warehouse
    const auth=firebase.auth();
    const loginErrMsg = e => ({
      "auth/invalid-credential":"Correo o contraseña incorrectos.",
      "auth/wrong-password":"Contraseña incorrecta.",
      "auth/user-not-found":"Ese correo no está registrado.",
      "auth/invalid-email":"El correo no es válido.",
      "auth/too-many-requests":"Demasiados intentos, espera unos minutos."
    }[e.code] || ("No se pudo iniciar sesión: "+e.message));
    async function doLogin(){
      $("#lErr").style.color="var(--danger)"; $("#lErr").textContent="";
      const email=$("#lEmail").value.trim(), pass=$("#lPass").value;
      if(!email||!pass){ $("#lErr").textContent="Escribe tu correo y contraseña."; return; }
      try{ await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); await auth.signInWithEmailAndPassword(email,pass); }
      catch(e){ $("#lErr").textContent=loginErrMsg(e); }
    }
    $("#btnLogin").onclick=doLogin;
    $("#lPass").addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); });
    $("#btnReset").onclick=async()=>{
      const email=$("#lEmail").value.trim();
      $("#lErr").style.color="var(--danger)";
      if(!email){ $("#lErr").textContent='Escribe tu correo y vuelve a tocar "Olvidé mi clave".'; return; }
      try{ await auth.sendPasswordResetEmail(email); $("#lErr").style.color="var(--ok)"; $("#lErr").textContent="Te enviamos un correo para cambiar la clave."; }
      catch(e){ $("#lErr").textContent="No se pudo enviar: "+e.message; }
    };
    $("#outBtn").onclick=()=>auth.signOut();
    let unsub=[];
    auth.onAuthStateChanged(user=>{
      unsub.forEach(u=>u()); unsub=[];
      if(!user){ this.db=null; $("#login").hidden=false; $("#acct").hidden=true; $("#lPass").value=""; $("#movilAvatar").textContent="?"; $("#movilAvatar").style.backgroundImage=""; return; }
      $("#login").hidden=true; $("#acct").hidden=false; $("#outBtn").title=`Cerrar sesión (${user.email})`;
      $("#acctName").textContent=user.displayName||user.email;
      $("#acctEmail").textContent=user.displayName?user.email:"";
      esAdmin = ADMINS.includes(user.email);
      const inicial=(user.displayName||user.email||"?").trim()[0].toUpperCase();
      [$("#acctAv"),$("#movilAvatar")].forEach(av=>{
        if(user.photoURL){ av.style.backgroundImage=`url(${user.photoURL})`; av.textContent=""; }
        else{ av.style.backgroundImage=""; av.textContent=inicial; }
      });
      this.db=db; $("#sync").textContent="Conectando…";
      const denied=e=>{ if(e&&e.code==="permission-denied"){ $("#lErr").textContent=`La cuenta ${user.email} no tiene acceso. Pide que la agreguen a la lista autorizada.`; auth.signOut(); } else $("#sync").textContent="Sin conexión"; };
      unsub.push(db.collection("productos").onSnapshot(snap=>{ S.productos=snap.docs.map(d=>fixProd({id:d.id,...d.data()})); $("#sync").textContent=snap.metadata.fromCache?"Sin conexión · cambios en cola":"Sincronizado"; this.saveLocal(); render(false); }, denied));
      unsub.push(db.collection("movimientos").orderBy("fecha","desc").limit(400).onSnapshot(snap=>{ S.movs=snap.docs.map(d=>({id:d.id,...d.data()})); render(false); }, ()=>{}));
      unsub.push(db.collection("documentos").orderBy("creado","desc").limit(500).onSnapshot(snap=>{ S.docs=snap.docs.map(d=>({id:d.id,...d.data()})); render(false); }, ()=>{}));
      unsub.push(db.collection("bodegas").onSnapshot(snap=>{
        S.bodegas = snap.docs.map(d=>({id:d.id,...d.data()}));
        if(!S.bodegas.length){ S.bodegas=BODEGAS_DEFAULT.map(b=>({...b})); if(esAdmin) BODEGAS_DEFAULT.forEach(b=>Store.putBodega(b)); }
        const cc=conCoolers(S.bodegas); S.bodegas=cc.list; if(esAdmin) cc.nuevos.forEach(b=>Store.putBodega(b));
        this.saveLocal(); render(false);
      }, ()=>{}));
    });
    render(false);
  },
  async putProducto(p){
    p = fixProd(p);   // asegura ubic/packUn/stock consistentes venga de donde venga (diálogo, import, movimiento)
    const {id,...body}=p;
    if(this.db) this.db.doc("productos/"+id).set(body).catch(syncErr);
    const i=S.productos.findIndex(x=>x.id===id); if(i>=0) S.productos[i]=p; else S.productos.push(p);
    this.saveLocal(); render(false);
  },
  async delProducto(id){
    if(this.db) this.db.doc("productos/"+id).delete().catch(syncErr);
    S.productos=S.productos.filter(x=>x.id!==id); this.saveLocal(); render(false);
  },
  async addMov(m, silent){
    const {id,...body}=m;
    if(this.db) this.db.doc("movimientos/"+id).set(body).catch(syncErr);
    if(!S.movs.find(x=>x.id===id)) S.movs.unshift(m);
    this.saveLocal(); if(!silent) render(false);
  },
  async addDocu(d){
    const {id,...body}=d;
    if(this.db) this.db.doc("documentos/"+id).set(body).catch(syncErr);
    if(!S.docs.find(x=>x.id===id)) S.docs.unshift(d);
    this.saveLocal();
  },
  async putBodega(b){
    const {id,...body}=b;
    if(this.db) await this.db.doc("bodegas/"+id).set(body).catch(syncErr);
    const i=S.bodegas.findIndex(x=>x.id===id); if(i>=0) S.bodegas[i]=b; else S.bodegas.push(b);
    this.saveLocal(); render(false);
  }
};

/* ---------- Logic ---------- */
// Same rule as the Excel: sin stock → CRÍTICO, bajo el mínimo → MÍNIMO, resto → SUFICIENTE
const estado = p => (+p.stock||0) <= 0 ? "critico" : (+p.stock||0) < (+p.minimo||0) ? "minimo" : "ok";
const critico = p => estado(p)!=="ok";   // needs replenishment (crítico or mínimo)
const ESTADO_TXT = {critico:"Crítico", minimo:"Mínimo", ok:"Suficiente"}, ESTADO_CLS = {critico:"crit", minimo:"min", ok:"ok"};
const DIAS_AVISO = 30;
function hoy0(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function diasVenc(p){ if(!p.vencimiento) return null; const [y,m,d]=p.vencimiento.split("-").map(Number); return Math.round((new Date(y,m-1,d)-hoy0())/86400000); }
function estVenc(p){ const d=diasVenc(p); if(d===null) return "none"; if(d<0) return "vencido"; if(d<=DIAS_AVISO) return "pv"; return "vig"; }
const fFecha = iso => { if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${d}-${m}-${y}`; };
function chipVenc(p){
  const d=diasVenc(p), e=estVenc(p);
  if(e==="none") return "";
  if(e==="vencido") return `<span class="chip venc" title="Venció el ${fFecha(p.vencimiento)}">Vencido hace ${-d} d</span>`;
  if(e==="pv") return `<span class="chip pv" title="Vence el ${fFecha(p.vencimiento)}">${d===0?"Vence hoy":`Vence en ${d} d`}</span>`;
  return `<span class="chip vig">Vence ${fFecha(p.vencimiento)}</span>`;
}


/* ---------- Product dialog ---------- */
let editId=null, fotoPend;   // undefined = sin cambios, null = foto quitada, string = foto nueva
function pintarFotoDlg(foto){
  $("#pFotoPrev").innerHTML = foto ? `<img src="${foto}" alt="">` : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>`;
  $("#pFotoDel").hidden = !foto;
}
function openProd(id){
  editId=id||null; const p=S.productos.find(x=>x.id===id);
  fotoPend=undefined; $("#pFoto").value=""; pintarFotoDlg(p?.foto||"");
  $("#dProdTitle").textContent=p?"Editar producto":"Agregar producto";
  $("#dProdSub").textContent=p?"El stock se cambia con Entrada, Salida o Conteo.":"El stock inicial queda registrado como primer movimiento.";
  $("#pCod").value=p?.codigo||""; $("#pCod").disabled=!!(p&&p.codigo);
  $("#pNombre").value=p?.nombre||""; $("#pUnd").value=p?.unidad||"UN";
  $("#pCat").value=p?.categoria||(S.cat!=="todas"&&S.screen==="tabla"?catName(S.cat):""); $("#pBod").value=p?.bodega||(S.bod!=="todas"?S.bod:"");
  $("#pUbic").value=p?.ubicacion||""; $("#pMin").value=p?.minimo??0; $("#pPack").value=p?.packUn??1; $("#pStock").value=0; $("#pVenc").value=p?.vencimiento||"";
  $("#pStockLbl").textContent=`Stock inicial (unidades, en ${bodNom((bods("reposicion")[0]||{}).id||"repo")})`;
  $("#stockField").hidden=!!p; $("#pDel").hidden=!p; $("#pErr").textContent="";
  $("#dProd").showModal(); (p?$("#pNombre"):$("#pCod")).focus();
}
$("#pFoto").addEventListener("change", async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{ fotoPend=await leerFotoComprimida(f); pintarFotoDlg(fotoPend); }
  catch{ toast("No se pudo leer la imagen."); }
});
$("#pFotoDel").addEventListener("click",()=>{ fotoPend=null; $("#pFoto").value=""; pintarFotoDlg(""); });
$("#fProd").addEventListener("submit", async e=>{
  e.preventDefault();
  const nombre=$("#pNombre").value.trim(), codigo=$("#pCod").value.trim();
  if(!nombre){ $("#pErr").textContent="Escribe el nombre del producto."; return; }
  const prev=S.productos.find(x=>x.id===editId);
  if(!prev && codigo && S.productos.some(x=>x.codigo===codigo)){ $("#pErr").textContent="Ya existe un producto con ese código."; return; }
  const p={ id: prev?prev.id:(codigo?idFromCode(codigo):uid()), codigo, nombre,
    unidad:$("#pUnd").value.trim().toUpperCase()||"UN", categoria:$("#pCat").value.trim()||"Sin categoría",
    bodega:$("#pBod").value.trim(), ubicacion:$("#pUbic").value.trim(),
    minimo:Math.max(0,+$("#pMin").value||0),
    packUn:Math.max(1,+$("#pPack").value||1),
    vencimiento:$("#pVenc").value||"",
    foto: fotoPend!==undefined ? (fotoPend||"") : (prev?.foto||""),
    ubic: prev ? prev.ubic : {[(bods("reposicion")[0]||{}).id||"repo"]:Math.max(0,+$("#pStock").value||0)} };
  p.stock = Object.values(p.ubic).reduce((a,n)=>a+n,0);
  p.actualizado = new Date().toISOString();
  try{
    $("#pSave").disabled=true;
    await Store.putProducto(p);
    if(!prev && p.stock>0) await Store.addMov({id:uid(),productoId:p.id,nombre:p.nombre,categoria:p.categoria,tipo:"entrada",cantidad:p.stock,stockFinal:p.stock,nota:"Stock inicial",fecha:new Date().toISOString()});
    $("#dProd").close(); toast(prev?"Producto guardado":"Producto agregado");
  }catch{ $("#pErr").textContent="No se pudo guardar. Revisa tu conexión e inténtalo de nuevo."; }
  finally{ $("#pSave").disabled=false; }
});
$("#pDel").addEventListener("click", async ()=>{
  const p=S.productos.find(x=>x.id===editId);
  if(!p || !confirm(`¿Eliminar "${p.nombre}"? Su historial de movimientos se mantiene.`)) return;
  try{ await Store.delProducto(p.id); $("#dProd").close(); toast("Producto eliminado"); }
  catch{ $("#pErr").textContent="No se pudo eliminar. Inténtalo de nuevo."; }
});

/* ---------- Movement dialog (Conteo físico) ---------- */
let movP=null, movT="ajuste", movU="repo";
function calc(){
  const c=Math.max(0,+$("#mCant").value||0), st=+movP.ubic[movU]||0;
  return {n: movT==="entrada" ? st+c : movT==="salida" ? st-c : c};
}
function updPrev(){

/* ---------- Import from Excel ---------- */
let pendientes=[];
const COLS = {
  codigo:["codigo","cod","sku","ean"], nombre:["producto","descripcion","nombre","articulo"],
  unidad:["und","unidad","um","u.m."], categoria:["categoria"], bodega:["bodega"], ubicacion:["ubicacion","ubic"],
  minimo:["stock minimo","stock min","minimo","min"],
  stock:["stock","stock actual","existencia act","existencia actual","existencia","cantidad","saldo","cant"],
  vencimiento:["vencimiento","fecha vencimiento","fecha de vencimiento","vence","fecha venc"]
};
function parseFecha(v){
  if(v===""||v===null||v===undefined) return "";
  if(typeof v==="number"){ if(v<20000) return ""; const d=new Date(Math.round((v-25569)*86400000)); return d.toISOString().slice(0,10); }
  const m=String(v).trim().match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/);
  if(!m) return "";
  const y=m[3].length===2?"20"+m[3]:m[3];
  return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
}
function mapHeader(row){
  const h=row.map(x=>norm(x).replace(/[:.]+$/,""));
  const m={};
  for(const [k,alts] of Object.entries(COLS)){
    let i=h.findIndex(x=>alts.includes(x));
    if(i<0 && k!=="stock") i=h.findIndex(x=>x && alts.some(a=>x.startsWith(a)));
    if(i<0 && k==="stock") i=h.findIndex(x=>x.startsWith("existencia"));
    if(i>=0) m[k]=i;
  }
  if(m.stock===undefined && m.minimo!==undefined){          // header sin nombre claro: columna numérica tras STOCK MÍNIMO
    for(let i=m.minimo+1;i<h.length;i++){ if(!/pmp|precio|costo|valoriz|venc|dias|estado/.test(h[i])){ m.stock=i; break; } }
  }
  return m;
}
$("#file").addEventListener("change", async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  if(!window.XLSX){ toast("No se pudo cargar el lector de Excel. Recarga la página."); return; }
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
    const hojas=[]; pendientes=[]; let malos=0;
    for(const name of wb.SheetNames){
      const r=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:""});
      const hi=r.slice(0,30).findIndex(x=>x.some(c=>["producto","descripcion"].includes(norm(c))));
      if(hi<0) continue;
      const map=mapHeader(r[hi]); if(map.nombre===undefined) continue;
      let n=0;
      for(const row of r.slice(hi+1)){
        const codigo = map.codigo!==undefined ? String(row[map.codigo]??"").trim().replace(/\.0+$/,"") : "";
        let nombre=String(row[map.nombre]??"").trim();
        if(!nombre && !codigo) continue;
        if(!nombre || /^[\d.,]+(e\+?\d+)?$/i.test(nombre)){ nombre=`Sin nombre (código ${codigo||"s/c"})`; malos++; }
        const get=k=>map[k]!==undefined?row[map[k]]:"";
        pendientes.push({ codigo, nombre,
          unidad:String(get("unidad")||"UN").trim().toUpperCase()||"UN",
          categoria:String(get("categoria")).trim()||"Sin categoría",
          bodega:String(get("bodega")).trim(), ubicacion:String(get("ubicacion")).trim().replace(/^-$/,""),
          minimo:parseNum(get("minimo")), stock:parseNum(get("stock")),
          vencimiento:parseFecha(get("vencimiento")) });
        n++;
      }
      if(n) hojas.push(`${name} (${n})`);
    }
    if(!hojas.length){ toast("No encontré una columna PRODUCTO en el archivo."); return; }
    // dedupe by código inside the file (last one wins)
    const byCode=new Map(); pendientes.forEach((p,i)=>byCode.set(p.codigo||("#"+i),p)); pendientes=[...byCode.values()];
    if(!pendientes.length){ toast("El archivo no tiene filas de productos."); return; }
    const nuevos=pendientes.filter(p=>!S.productos.some(x=>(p.codigo&&x.codigo===p.codigo))).length;
    const conVenc=pendientes.filter(p=>p.vencimiento).length;
    $("#iSub").textContent=`${f.name} · hojas: ${hojas.join(", ")}`;
    $("#iPrev").innerHTML=`<strong>${pendientes.length}</strong> productos encontrados: ${nuevos} nuevos y ${pendientes.length-nuevos} que ya existen (se actualizan por código).<br>
      ${pendientes.filter(p=>p.stock<=0).length} sin stock y ${pendientes.filter(p=>p.stock>0&&p.stock<p.minimo).length} bajo el mínimo.
      <br>${conVenc} con fecha de vencimiento.
      ${malos?`<br><strong>${malos}</strong> fila${malos===1?"":"s"} con el nombre del producto vacío o con un número en vez de texto: se cargan como "Sin nombre" para que las corrijas con Editar.`:""}`;
    $("#iErr").textContent=""; $("#iBar").hidden=true; $("#iGo").disabled=false;
    $("#dImp").showModal();
  }catch(err){ toast("No se pudo leer el archivo. Verifica que sea un Excel o CSV."); }
});
$("#iGo").addEventListener("click", async ()=>{
  $("#iGo").disabled=true; $("#iBar").hidden=false; const bar=$("#iBar span");
  let ok=0;
  try{
    for(const [i,row] of pendientes.entries()){
      const prev=row.codigo ? S.productos.find(x=>x.codigo===row.codigo) : null;
      // El Excel representa el conteo de la primera bodega de Reposición; lo demás se conserva.
      const bodImp=(bods("reposicion")[0]||{}).id||"repo";
      const ubic={...(prev?.ubic||{}), [bodImp]:+row.stock||0};
      const p={ id: prev?prev.id:(row.codigo?idFromCode(row.codigo):uid()), ...row, ubic, packUn:prev?.packUn||1,
        stock:Object.values(ubic).reduce((a,n)=>a+n,0), actualizado:new Date().toISOString() };
      await Store.putProducto(p);
      if(!prev || prev.stock!==p.stock)
        await Store.addMov({id:uid(),productoId:p.id,nombre:p.nombre,categoria:p.categoria,tipo:"ajuste",cantidad:p.stock,stockFinal:p.stock,nota:"Importado desde Excel",fecha:new Date().toISOString()}, true);
      ok++; bar.style.width=((i+1)/pendientes.length*100)+"%";
    }
    $("#dImp").close(); render(); toast(`${ok} productos importados`);
  }catch(err){
    $("#iErr").textContent = err && err.code==="quota_exceeded"
      ? `Se alcanzó el límite de la base después de ${ok} productos.`
      : `Se importaron ${ok} de ${pendientes.length}. Revisa tu conexión y vuelve a importar el archivo para completar.`;
    $("#iGo").disabled=false; render();
  }
});

async function exportar(list){
  if(!Store.dl || !window.XLSX) return;
  const bs=bods();
  const data=list.map(p=>{
    const row={ "CÓDIGO":p.codigo, "PRODUCTO":p.nombre, "UND":p.unidad, "UN/PACK":p.packUn, "CATEGORÍA":p.categoria, "BODEGA":p.bodega,
      "UBICACIÓN":p.ubicacion, "STATUS":ESTADO_TXT[estado(p)].toUpperCase(), "STOCK MÍNIMO":p.minimo, "EXISTENCIA ACT":p.stock };
    bs.forEach(b=>{ row[b.nombre.toUpperCase()]=p.ubic[b.id]||0; });
    row["VENCIMIENTO"]=fFecha(p.vencimiento); row["DÍAS DISPONIBLES"]=diasVenc(p)??""; row["ESTADO PRODUCTO"]={none:"Sin fecha",vencido:"Vencido",pv:"Por vencer",vig:"Vigente"}[estVenc(p)];
    return row;
  });
  const ws=XLSX.utils.json_to_sheet(data), wb=XLSX.utils.book_new();
  ws["!cols"]=[{wch:15},{wch:48},{wch:6},{wch:8},{wch:14},{wch:10},{wch:10},{wch:12},{wch:13},{wch:14},...bs.map(()=>({wch:12})),{wch:16},{wch:15}];
  XLSX.utils.book_append_sheet(wb, ws, "Inventario");
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  const hoy=new Date().toISOString().slice(0,10);
  try{ await Store.dl.save({filename:`bodeka-inventario-${hoy}.xlsx`, data:new Blob([buf])}); }
  catch(err){ if(err && err.code!=="declined") toast("No se pudo generar la descarga."); }
}
