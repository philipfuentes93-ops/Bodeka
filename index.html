  const kpi=(tab,ic,v,t,c)=>`<button class="kpi" data-go="tabla" data-cat="todas" ${tab?`data-tab="${tab}"`:""} style="--c:${c}"><span class="ic">${ic}</span><span><b>${v}</b><span>${t}</span></span></button>`;
  const kpis=`<div class="kpis">${kpi("",DI.box,ps.length,"Productos","var(--accent)")}${kpi("reponer",DI.alert,nMin+nCrit,"Por reponer","var(--warn)")}${kpi("critico",DI.empty,nCrit,"Sin stock","var(--danger)")}${kpi("vencido",DI.cal,nVen,"Vencidos","var(--danger)")}${kpi("pv",DI.clock,nPv,`Por vencer · ${DIAS_AVISO} días`,"var(--c2)")}</div>`;
  const cs=[...cats()].sort((a,b)=>a.localeCompare(b,"es"));
  const catsCard=`<section class="card dcard span-12"><h3>Categorías<span class="muted">Toca una para ver su inventario</span></h3>
      <div class="cats2">${cs.map(c=>`<button class="cat2" style="--c:${catColor(c)}" data-go="tabla" data-cat="${esc(c)}"><span class="ci">${esc(ini(c))}</span><span class="cn">${esc(c)}${DI.arrow}</span></button>`).join("")}
      ${cs.length>1?`<button class="cat2" style="--c:var(--accent)" data-go="tabla" data-cat="todas"><span class="ci">${DI.box.replace('<svg','<svg width="18" height="18"')}</span><span class="cn">Todo el inventario${DI.arrow}</span></button>`:""}</div></section>`;
  const rep=ps.filter(critico).sort((a,b)=>(a.stock/Math.max(a.minimo,1))-(b.stock/Math.max(b.minimo,1))).slice(0,6);
  const repCard=`<section class="card dcard span-4"><h3>Por reponer<span class="muted">${nMin+nCrit} productos</span></h3>
      ${rep.length?`<ul class="plist">${rep.map(p=>{const st=estado(p), c=st==="critico"?"var(--danger)":"var(--warn)";
        return `<li><span class="thumb" style="--c:${catColor(p.categoria)}">${thumbHtml(p)}</span><div style="min-width:0"><div class="nm" title="${esc(p.nombre)}">${esc(p.nombre)}</div><div class="sb" style="--c:${c}"><span class="mb"><i style="width:${Math.min(100,p.stock/Math.max(1,p.minimo)*100)}%"></i></span>${fmt(p.stock)} / ${fmt(p.minimo)}</div></div><div class="rt">Pedir<b>${fmt(pedir(p))}</b></div></li>`;}).join("")}</ul>
      <button class="link more" data-go="tabla" data-cat="todas" data-tab="reponer">Ver todos</button>`:'<p class="mini-empty">Nada por reponer. ¡Bien!</p>'}</section>`;
  const venc=ps.filter(p=>["vencido","pv"].includes(estVenc(p))&&(+p.stock||0)>0).sort((a,b)=>diasVenc(a)-diasVenc(b)).slice(0,6);
  const vencCard=`<section class="card dcard span-4"><h3>Vencimientos<span class="muted">con stock en bodega</span></h3>
      ${venc.length?`<ul class="plist">${venc.map(p=>{const d=diasVenc(p);
        return `<li><span class="thumb" style="--c:${catColor(p.categoria)}">${thumbHtml(p)}</span><div style="min-width:0"><div class="nm" title="${esc(p.nombre)}">${esc(p.nombre)}</div><div class="sb">${fFecha(p.vencimiento)} · ${fmt(p.stock)} ${esc(p.unidad)}</div></div><div class="rt"><span class="pill ${d<0?"venc":"pv"}" style="min-width:0">${d<0?`Hace ${-d} d`:d===0?"Hoy":`${d} d`}</span></div></li>`;}).join("")}</ul>
      <button class="link more" data-go="tabla" data-cat="todas" data-tab="vencido">Ver vencidos</button>`:'<p class="mini-empty">Sin productos vencidos ni próximos a vencer.</p>'}</section>`;
  const hoy=hoyISO(), dh=S.docs.filter(d=>d.fecha===hoy);
  const sumU=t=>dh.filter(d=>d.tipo===t).reduce((a,d)=>a+(+d.unidades||0),0), cntD=t=>dh.filter(d=>d.tipo===t).length;
  const TP={entrada:["+","var(--ok)"],salida:["−","var(--danger)"],ajuste:["=","var(--accent)"],picking:["↔","var(--c2)"]};
  const feed=S.movs.slice(0,6);
  const actCard=`<section class="card dcard span-4"><h3>Actividad de hoy</h3>
      <div class="today"><div class="tbox" style="--c:var(--ok)"><span>Recepciones</span><b>${cntD("recepcion")}</b><small>${fmt(sumU("recepcion"))} unidades</small></div>
        <div class="tbox" style="--c:var(--danger)"><span>Despachos</span><b>${cntD("despacho")}</b><small>${fmt(sumU("despacho"))} unidades</small></div></div>
      <h3 style="margin:18px 0 6px">Últimos movimientos</h3>
      ${feed.length?`<ul class="feed">${feed.map(m=>{const t=TP[m.tipo]||TP.ajuste, d=new Date(m.fecha);
        return `<li><span class="fi" style="--c:${t[1]}">${t[0]}</span><div style="min-width:0"><div class="nm" title="${esc(m.nombre)}">${esc(m.nombre)}</div><div class="sb">${esc(m.folio||(m.tipo==="ajuste"?"Conteo":""))}${m.folio||m.tipo==="ajuste"?" · ":""}${d.toLocaleDateString("es-CL",{day:"2-digit",month:"short"})}</div></div><div class="q" style="color:${t[1]}">${t[0]}${fmt(m.cantidad)}<small>queda ${fmt(m.stockFinal)}</small></div></li>`;}).join("")}</ul>
      <button class="link more" data-go="movs">Ver todos</button>`:'<p class="mini-empty">Aún no hay movimientos.</p>'}</section>`;
  const donut = ps.length ? `<div class="span-4">${donutCard()}</div>` : "";
  const bodGrupo=(tipo,t)=>{ const bs=bods(tipo);
    return `<div><p class="bt">${t}</p>${bs.length?`<ul class="ov-m bl">${bs.map(b=>`<li><span class="nm">${esc(b.nombre)}</span><span class="q">${fmt(ps.reduce((a,p)=>a+(p.ubic?.[b.id]||0),0))} un</span></li>`).join("")}</ul>`:'<p class="mini-empty">Sin bodegas de este tipo.</p>'}</div>`; };
  const bodCard = ps.length&&bods().length?`<section class="card dcard span-12"><h3>Inventario por bodega${esAdmin?`<span class="muted"><button class="link" data-go="bodegas" style="font-size:.8rem">Gestionar bodegas</button></span>`:""}</h3>
      <div class="bodgrid">${bodGrupo("reposicion","Reposición")}${bodGrupo("picking","Picking · tránsito")}${bodGrupo("cooler","Coolers")}</div></section>`:"";
  return `<div class="ph"><h1>Resumen</h1><span class="spacer"></span><button class="addlink" data-add>+ Agregar producto</button></div>
    <div class="dash">${hero}${health}${ps.length?kpis:""}${bodCard}${donut?catsCard.replace("span-12","span-8"):catsCard}${donut}${ps.length?repCard+vencCard+actCard:""}</div>`;
}

function pager(total){
  const pages=Math.max(1,Math.ceil(total/S.size)); S.page=Math.min(Math.max(1,S.page),pages);
  const a=total?(S.page-1)*S.size+1:0, b=Math.min(total,S.page*S.size);
  return `<div class="pager"><label>Filas por página <select id="psize">${[25,50,100,250].map(n=>`<option ${n===S.size?"selected":""}>${n}</option>`).join("")}</select></label><span class="spacer"></span>
    <span>${a}–${b} de ${total}</span>
    <div class="pages"><button data-page="${S.page-1}" ${S.page<=1?"disabled":""} aria-label="Página anterior">${ICON.prev}</button><button data-page="${S.page+1}" ${S.page>=pages?"disabled":""} aria-label="Página siguiente">${ICON.next}</button></div></div>`;
}

function overview(){
  const n=f=>S.productos.filter(f).length;
  const TP={entrada:["Entrada","in","+"],salida:["Salida","out","−"],ajuste:["Conteo","adj","="],picking:["Picking","adj","↔"]};
  return `<aside class="ov" aria-label="Resumen">
    <p class="ov-t">Resumen</p>
    <button class="ov-i" data-tab="todos"><span>Productos</span><b>${S.productos.length}</b></button>
    <button class="ov-i" data-tab="reponer"><span>Por reponer</span><b class="r">${n(critico)}</b></button>
    <button class="ov-i" data-tab="vencido"><span>Vencidos</span><b class="r">${n(p=>estVenc(p)==="vencido")}</b></button>
    <button class="ov-i" data-tab="pv"><span>Por vencer (${DIAS_AVISO} días)</span><b class="w">${n(p=>estVenc(p)==="pv")}</b></button>
    <hr><p class="ov-t">Movimientos recientes</p>
    ${S.movs.length?`<ul class="ov-m">${S.movs.slice(0,6).map(m=>{const t=TP[m.tipo]||TP.ajuste; return `<li><span class="pill ${t[1]}">${t[0]}</span><span class="nm" title="${esc(m.nombre)}">${esc(m.nombre)}</span><span class="q">${t[2]}${fmt(m.cantidad)}</span></li>`;}).join("")}</ul><button class="link" data-go="movs">Ver todos</button>`:'<p class="muted" style="margin:0;font-size:.84rem">Aún no hay movimientos.</p>'}
  </aside>`;
}

function expDetalle(p){
  const hist=S.movs.filter(m=>m.productoId===p.id).slice(0,5);
  const TP={entrada:["Entrada","in","+"],salida:["Salida","out","−"],ajuste:["Conteo","adj","="],picking:["Picking","adj","↔"]};
  const f=(k,t,v,extra="",cls="")=>`<div class="uf ${cls}"><label for="ef-${k}">${t}</label><input id="ef-${k}" data-ef="${k}" value="${esc(v)}" ${extra}></div>`;
  return `<div class="exp-in">
      <div class="exp-media"><div class="bigthumb" style="--c:${catColor(p.categoria)}">${thumbHtml(p)}<label class="fotoedit" for="efFoto-${p.id}">${p.foto?"Cambiar foto":"Agregar foto"}</label><input type="file" id="efFoto-${p.id}" data-effoto="${p.id}" accept="image/*" hidden></div>
        <div class="bigstock"><b class="${estado(p)!=="ok"?"neg":""}" style="color:${estado(p)==="ok"?"inherit":"var(--danger)"}">${fmt(p.stock)}</b> ${esc(p.unidad)}<span>disponibles · mínimo ${fmt(p.minimo)}</span></div>
        <ul class="ov-m bl" style="width:100%;margin:2px 0 0">${bods().map(b=>`<li><span class="nm">${esc(b.nombre)}</span><span class="q">${fmt(p.ubic[b.id]||0)}</span></li>`).join("")}</ul>
        <div class="exp-btns"><button class="btn soft sm" data-newp="recepcion" data-id="${p.id}">Recibir</button><button class="btn soft sm" data-newp="despacho" data-id="${p.id}">Despachar</button><button class="btn ghost sm" data-mov="ajuste" data-id="${p.id}">Conteo físico</button></div></div>
      <div class="exp-grid">
        ${f("nombre","Producto",p.nombre,'maxlength="120"',"wide")}
        ${f("codigo","Código",p.codigo||"",'maxlength="30" inputmode="numeric"')}
        ${f("categoria","Categoría",p.categoria||"",'list="cats" maxlength="40"')}
        ${f("unidad","Unidad",p.unidad,'list="unds" maxlength="10"')}
        ${f("minimo","Stock mínimo",p.minimo,'type="number" min="0" step="any"')}
        ${f("packUn","Unidades por pack",p.packUn,'type="number" min="1" step="1"')}
        ${f("bodega","Bodega",p.bodega||"",'list="bods" maxlength="40"')}
        ${f("ubicacion","Ubicación",p.ubicacion||"",'maxlength="20"')}
        ${f("vencimiento","Vencimiento",p.vencimiento||"",'type="date"')}
      </div>
      <div class="exp-hist"><p>Últimos movimientos</p>${hist.length?`<ul>${hist.map(m=>{const t=TP[m.tipo]||TP.ajuste; return `<li><span class="pill ${t[1]}">${t[0]}</span><span>${new Date(m.fecha).toLocaleDateString("es-CL")}${m.folio?` · ${esc(m.folio)}`:""}</span><b>${t[2]}${fmt(m.cantidad)}</b></li>`;}).join("")}</ul>`:'<span class="muted" style="font-size:.84rem">Sin movimientos registrados.</span>'}</div>
    </div>
    <div class="exp-foot"><button class="link danger" data-delp="${p.id}">Eliminar producto</button><span class="spacer"></span>
      <span class="saved ${S.saved===p.id?"ok":""}">${S.saved===p.id?"✓ Guardado automáticamente":"Los cambios se guardan automáticamente"}</span></div>`;
}
function expRow(p, span){
  return `<tr class="exp"><td colspan="${span}"><div class="expbox">${expDetalle(p)}</div></td></tr>`;
}
function pcard(p){
  const st=estado(p), op=S.open===p.id;
  const pct=Math.min(100,(+p.stock||0)/Math.max(1,(+p.minimo||0)*2)*100);
  return `<div class="pcard ${op?"is-open":""}">
    <div class="pcard-top">
      <span class="thumb" style="--c:${catColor(p.categoria)}" aria-hidden="true">${thumbHtml(p)}</span>
      <div class="pcard-info"><button class="rowlink" data-open="${p.id}">${esc(p.nombre)}</button>
        <span class="sub">${p.codigo?esc(p.codigo)+" · ":""}${esc(p.unidad)}${p.bodega?` · ${esc(p.bodega)}`:""}</span></div>
      <span class="pill ${ESTADO_CLS[st]}">${ESTADO_TXT[st]}</span>
    </div>
    <div class="pcard-mid">
      <div class="stkv"><b style="color:${st==="ok"?"inherit":"var(--danger)"}">${fmt(p.stock)}</b><span>/ ${fmt(p.minimo)}</span></div>
      <div class="mbar ${ESTADO_CLS[st]==="ok"?"":ESTADO_CLS[st]}"><i style="width:${st==="critico"?0:pct}%"></i></div>
      ${chipVenc(p)}
    </div>
    <div class="pcard-acts">
      <button class="ib in" data-newp="recepcion" data-id="${p.id}" title="Recibir" aria-label="Recibir ${esc(p.nombre)}">+</button>
      <button class="ib out" data-newp="despacho" data-id="${p.id}" title="Despachar" aria-label="Despachar ${esc(p.nombre)}">−</button>
      <button class="ib exp" data-open="${p.id}" aria-expanded="${op}" title="Ver y editar" aria-label="Ver y editar ${esc(p.nombre)}">${ICON.chev}</button>
    </div>
    ${op?`<div class="expbox pcard-exp">${expDetalle(p)}</div>`:""}
  </div>`;
}

function viewTabla(){
  const cs=[...cats()].sort((a,b)=>a.localeCompare(b,"es"));
  const baseCat=S.cat==="todas"?S.productos:S.productos.filter(p=>norm(p.categoria)===norm(S.cat));
  const bs=[...new Set(baseCat.map(p=>p.bodega).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es",{numeric:true}));
  if(!bs.includes(S.bod)) S.bod="todas";
  const o=(v,t,cur)=>`<option value="${esc(v)}" ${norm(v)===norm(cur)?"selected":""}>${esc(t)}</option>`;
  const head=`<div class="ph"><h1>Productos</h1>
    <label class="pillsel"><span>Categoría:</span><select id="fcat" aria-label="Categoría">${o("todas","Todas",S.cat)}${cs.map(c=>o(c,c,S.cat)).join("")}</select></label>
    ${bs.length>1?`<label class="pillsel"><span>Bodega:</span><select id="fbod" aria-label="Bodega">${o("todas","Todas",S.bod)}${bs.map(b=>o(b,b,S.bod)).join("")}</select></label>`:""}
    <label class="qsearch">${ICON.search}<input id="fq" type="search" value="${esc(S.q)}" placeholder="Búsqueda rápida" aria-label="Buscar por producto o código"></label>
    <span class="spacer"></span><button class="addlink" data-add>+ Agregar producto</button></div>`;
  if(!S.productos.length) return head+`<div class="card empty">Aún no hay productos cargados.<div class="btns"><button class="btn brand" data-imp>Importar Excel</button><button class="btn ghost" data-add>Agregar producto</button></div></div>`;
  const base=baseList();
  const tabs=`<div class="ftabs" role="tablist">${TABS.map(([k,t])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${t}<span class="ct">${base.filter(TABF[k]).length}</span></button>`).join("")}</div>`;
  const showPedir=S.tab==="reponer"||S.tab==="critico", showCat=S.cat==="todas";
  const cols=[
    {k:"nombre",t:"Producto",v:p=>p.nombre},
    showCat&&{k:"categoria",t:"Categoría",v:p=>p.categoria||""},
    {k:"bodega",t:"Bodega",v:p=>p.bodega||""},
    {k:"stock",t:"Stock / mín.",v:p=>+p.stock||0},
    {k:"status",t:"Status",c:1,v:p=>["critico","minimo","ok"].indexOf(estado(p))},
    {k:"dias",t:"Vencimiento",v:p=>diasVenc(p)??1e9},
    showPedir&&{k:"pedir",t:"Pedir",n:1,v:pedir}
  ].filter(Boolean);
  const ps=visibles(), col=cols.find(c=>c.k===S.sort.k)||cols[1];
  ps.sort((a,b)=>{const x=col.v(a), y=col.v(b); return (typeof x==="number"&&typeof y==="number"? x-y : String(x).localeCompare(String(y),"es",{numeric:true}))*S.sort.dir;});
  const tot=ps.length, rows=ps.slice((Math.max(1,S.page)-1)*S.size, Math.max(1,S.page)*S.size), pag=pager(tot);
  const span=cols.length+3;
  const arrow=k=> S.sort.k===k ? (S.sort.dir>0?" ↑":" ↓") : "";
  const allSel=rows.length && rows.every(p=>S.sel.has(p.id));
  const cell=(p,c)=>{ const st=estado(p);
    switch(c.k){
      case "codigo": return `<td class="muted">${esc(p.codigo)||"-"}</td>`;
      case "nombre": return `<td class="prod"><button class="rowlink" data-open="${p.id}">${esc(p.nombre)}</button><span class="sub">${p.codigo?esc(p.codigo)+" · ":""}${esc(p.unidad)}${p.ubicacion?` · Ubic. ${esc(p.ubicacion)}`:""}</span></td>`;
      case "categoria": return `<td><span class="catpill" style="--c:${catColor(p.categoria)}">${esc(p.categoria)}</span></td>`;
      case "bodega": return `<td>${esc(p.bodega)||'<span class="muted">-</span>'}</td>`;
      case "stock": { const pct=Math.min(100,(+p.stock||0)/Math.max(1,(+p.minimo||0)*2)*100);
        return `<td><div class="stkv"><b style="color:${st==="ok"?"inherit":"var(--danger)"}">${fmt(p.stock)}</b><span>/ ${fmt(p.minimo)}</span></div><div class="mbar ${ESTADO_CLS[st]==="ok"?"":ESTADO_CLS[st]}"><i style="width:${st==="critico"?0:pct}%"></i></div></td>`; }
      case "status": return `<td class="c"><span class="pill ${ESTADO_CLS[st]}">${ESTADO_TXT[st]}</span></td>`;
      case "dias": { const e=estVenc(p), d=diasVenc(p); if(e==="none") return `<td class="muted">-</td>`;
        return `<td>${fFecha(p.vencimiento)}<span class="vd" style="color:${e==="vencido"?"var(--danger)":e==="pv"?"var(--warn)":"var(--muted)"}">${e==="vencido"?`Vencido hace ${-d} d`:d===0?"Vence hoy":`${d} días`}</span></td>`; }
      case "pedir": return `<td class="n stk">${fmt(pedir(p))}</td>`;
    }};
  const table = !tot ? `<div class="empty">No hay productos en esta pestaña con los filtros actuales.</div>`
   : `<div class="tbl-wrap prod-tbl"><table class="db"><thead><tr>
      <th class="cb"><span><input type="checkbox" data-selall ${allSel?"checked":""} aria-label="Seleccionar todos los de esta página"></span></th><th><span></span></th>
      ${cols.map(c=>`<th class="${c.n?"n":c.c?"c":""}" aria-sort="${S.sort.k===c.k?(S.sort.dir>0?"ascending":"descending"):"none"}"><button data-sort="${c.k}">${c.t}${arrow(c.k)}</button></th>`).join("")}
      <th class="n"><span>Acciones</span></th></tr></thead>
    <tbody>${rows.map(p=>{ const op=S.open===p.id, se=S.sel.has(p.id);
      return `<tr class="${op?"is-open":""} ${se?"is-sel":""}" data-row="${p.id}">
        <td class="cb"><input type="checkbox" data-sel="${p.id}" ${se?"checked":""} aria-label="Seleccionar ${esc(p.nombre)}"></td>
        <td><span class="thumb" style="--c:${catColor(p.categoria)}" aria-hidden="true">${thumbHtml(p)}</span></td>
        ${cols.map(c=>cell(p,c)).join("")}
        <td><div class="acts"><button class="ib in" data-newp="recepcion" data-id="${p.id}" title="Recibir" aria-label="Recibir ${esc(p.nombre)}">+</button><button class="ib out" data-newp="despacho" data-id="${p.id}" title="Despachar" aria-label="Despachar ${esc(p.nombre)}">−</button><button class="ib exp" data-open="${p.id}" aria-expanded="${op}" title="Ver y editar" aria-label="Ver y editar ${esc(p.nombre)}">${ICON.chev}</button></div></td></tr>
        ${op?expRow(p,span):""}`; }).join("")}</tbody></table></div>
    <div class="pcards">${rows.map(pcard).join("")}</div>`;
  const bulk = S.sel.size ? `<div class="bulk"><b>${S.sel.size} seleccionado${S.sel.size===1?"":"s"}</b>
      <button class="btn soft sm" data-bulk="recepcion">Recibir</button><button class="btn soft sm" data-bulk="despacho">Despachar</button>${Store.dl?'<button class="btn ghost sm" data-bulk="export">Exportar</button>':""}
      <span class="spacer"></span><button class="link" data-bulk="clear">Quitar selección</button></div>` : "";
  return head+`<div class="prod-layout"><div>${tabs}<div class="card">${table}${tot?pag:""}${bulk}</div></div>${overview()}</div>`;
}

function viewMovs(){
  const q=norm(S.mq);
  const ms=S.movs.filter(m=>!q || norm(m.nombre+" "+(m.nota||"")+" "+(m.categoria||"")).includes(q));
  const head=`<div class="ph"><h1>Movimientos</h1><label class="qsearch">${ICON.search}<input id="mq" type="search" value="${esc(S.mq)}" placeholder="Producto, categoría o nota" aria-label="Buscar movimientos"></label></div>`;
  if(!ms.length) return head+`<div class="card empty">Sin movimientos registrados.</div>`;
  const tot=ms.length, pag=pager(tot), rows=ms.slice((S.page-1)*S.size,S.page*S.size);
  const TP={entrada:["Entrada","in"],salida:["Salida","out"],ajuste:["Conteo","adj"],picking:["Picking","adj"]};
  const th=(t,c="")=>`<th class="${c}"><span>${t}</span></th>`;

async function saveInline(el){

async function confirmarDoc(){
  const f=S.form, D=DOC[f.tipo];
  const lines=f.lineas.map(l=>({...l, p:S.productos.find(x=>x.id===l.id), q:+l.cantidad})).filter(l=>l.p);
  let err="";
  if(!lines.length) err="Agrega al menos un producto.";
  else if(lines.some(l=>!(l.q>0))) err="Todas las líneas necesitan una cantidad mayor a cero.";
  else if(f.tipo==="despacho"){ const x=lines.find(l=>l.q*(l.p.packUn||1)>(l.p.ubic[f.bod]||0)); if(x) err=`No hay stock suficiente de "${x.p.nombre}" en ${bodNom(f.bod)}: disponible ${fmt(x.p.ubic[f.bod]||0)} un (${fmt((x.p.ubic[f.bod]||0)/(x.p.packUn||1))} packs).`; }
  if(!err && !f.tercero.trim()) err=`Indica el ${D.tercero.toLowerCase()}.`;
  if(err){ f.err=err; render(true); return; }
  const numero=Math.max(0,...S.docs.filter(d=>d.tipo===f.tipo).map(d=>+d.numero||0))+1;
  const folio=`${D.pref}-${String(numero).padStart(4,"0")}`, now=new Date().toISOString();
  const btn=$("#confirmBtn"); btn.disabled=true; btn.textContent="Guardando…";
  let hechas=0;
  try{
    for(const l of lines){
      const cur=S.productos.find(x=>x.id===l.id)||l.p;
      const qUn=l.q*(cur.packUn||1);
      const nuevoVal=f.tipo==="recepcion"?(cur.ubic[f.bod]||0)+qUn:(cur.ubic[f.bod]||0)-qUn;
      const ubic={...cur.ubic, [f.bod]:nuevoVal};
      const p={...cur, ubic, stock:Object.values(ubic).reduce((a,n)=>a+n,0), actualizado:now};
      if(f.tipo==="recepcion" && l.venc) p.vencimiento=l.venc;
      await Store.putProducto(p);
      await Store.addMov({id:uid(),productoId:p.id,nombre:p.nombre,categoria:p.categoria,tipo:D.mov,cantidad:qUn,cantidadPack:l.q,stockFinal:p.stock,
        nota:[folio, f.docNum?`${f.docTipo} ${f.docNum}`:"", f.tercero.trim()].filter(Boolean).join(" · "), fecha:now, folio}, true);
      hechas++;
    }
    await Store.addDocu({id:uid(), tipo:f.tipo, numero, folio, fecha:f.fecha, docTipo:f.docTipo, docNum:f.docNum.trim(), tercero:f.tercero.trim(),
      solicitante:f.solicitante.trim(), nota:f.nota.trim(), creado:now, unidades:lines.reduce((a,l)=>a+l.q*(l.p.packUn||1),0),
      lineas:lines.map(l=>({productoId:l.id, codigo:l.p.codigo||"", nombre:l.p.nombre, unidad:l.p.unidad, cantidad:l.q*(l.p.packUn||1), packs:l.q, packUn:l.p.packUn||1, vencimiento:l.venc||""}))});
    S.form=null; S.screen=f.tipo==="recepcion"?"recep":"desp"; S.page=1; render(); toast(`${D.t} ${folio} ${D.hecho}`);
  }catch(e){
    f.err = hechas ? `Se guardaron ${hechas} de ${lines.length} líneas antes de perder la conexión. Revisa Movimientos antes de reintentar para no duplicar.` : "No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.";
    render(true);
  }
}

function stepPk(i,d,dest){
  const l=S.pkLineas[i]; if(!l) return;
  if(dest){ l.por=l.por||{}; l.por[dest]=String(Math.max(0,(+l.por[dest]||0)+d)); pkSetGen(l);

  else { l.cantidad=String(Math.max(0,(+l.cantidad||0)+d)); const inp=document.querySelector(`[data-pkq="${i}"]`); if(inp) inp.value=l.cantidad; }

async function confirmarPicking(){
  const orig=S.pkOrig, dest=S.pkUbic, gen=dest===PK_GEN, cs=pkCoolers();
  if(orig===dest){ S.pkErr="El origen y el destino deben ser distintos."; render(true); return; }
  const lines=S.pkLineas.map(l=>({...l, p:S.productos.find(x=>x.id===l.id), q:+l.cantidad})).filter(l=>l.p);
  if(!lines.length){ S.pkErr="Agrega al menos un producto."; render(true); return; }
  if(lines.some(l=>!(l.q>0))){ S.pkErr=gen?"Cada producto necesita unidades para al menos un cooler.":"Todas las líneas necesitan una cantidad mayor a cero."; render(true); return; }
  const x=lines.find(l=>l.q>(l.p.ubic[orig]||0));
  if(x){ S.pkErr=`No hay stock suficiente de "${x.p.nombre}" en ${bodNom(orig)}: disponible ${fmt(x.p.ubic[orig]||0)} un.`; render(true); return; }
  S.pkErr="";
  const reparto=l=>{ const r={}; cs.forEach(c=>{ const n=+(l.por||{})[c.id]||0; if(n>0) r[c.id]=n; }); return r; };
  const numero=Math.max(0,...S.docs.filter(d=>d.tipo==="picking").map(d=>+d.numero||0))+1;
  const folio=`PK-${String(numero).padStart(4,"0")}`, now=new Date().toISOString();
  const btn=$("#pkConfirm"); btn.disabled=true; btn.textContent="Guardando…";
  let hechas=0;
  try{
    for(const l of lines){
      const cur=S.productos.find(x=>x.id===l.id)||l.p;
      const ubic={...cur.ubic, [orig]:(cur.ubic[orig]||0)-l.q};
      const rp=gen?reparto(l):{[dest]:l.q};
      Object.entries(rp).forEach(([k,n])=>{ ubic[k]=(ubic[k]||0)+n; });
      const p={...cur, ubic, stock:Object.values(ubic).reduce((a,n)=>a+n,0), actualizado:now};
      await Store.putProducto(p);
      const det=gen?Object.entries(rp).map(([k,n])=>`${bodNom(k)}: ${fmt(n)}`).join(", "):bodNom(dest);
      await Store.addMov({id:uid(),productoId:p.id,nombre:p.nombre,categoria:p.categoria,tipo:"picking",cantidad:l.q,stockFinal:p.stock,
        nota:`${folio} · Picking de ${bodNom(orig)} a ${gen?"General ("+det+")":det}`,fecha:now,folio}, true);
      hechas++;
    }
    const doc={id:uid(), tipo:"picking", numero, folio, fecha:hoyISO(), ubicOrigen:orig, ubicDestino:dest, creado:now, unidades:lines.reduce((a,l)=>a+l.q,0),
      lineas:lines.map(l=>({productoId:l.id, codigo:l.p.codigo||"", nombre:l.p.nombre, cantidad:l.q, packUn:l.p.packUn||1, ubicacion:l.p.ubicacion||"", ...(gen?{reparto:reparto(l)}:{})}))};
    if(gen) doc.destinos=cs.map(c=>c.id);
    await Store.addDocu(doc);
    S.pkLineas=[]; S.pkq=""; render();
    toast(`${folio} registrado · ${fmt(doc.unidades)} unidades a ${bodNom(dest)}`);
    if(confirm(`${folio} registrado.\n¿Imprimir la hoja de recolección?`)) imprimirHojaPicking(doc);
  }catch(e){
    S.pkErr = hechas ? `Se guardaron ${hechas} de ${lines.length} líneas antes de perder la conexión.` : "No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.";
    render(true);
  }
}

/* ---------- Picking: historial (día / semana) ---------- */
function pkFechaLocal(d){ return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function pkRangoFechas(){
  const hoy=new Date(); hoy.setHours(12,0,0,0);
  if(S.pkRango==="hoy"){ const f=pkFechaLocal(hoy); return {ini:f, fin:f, dias:[f]}; }
  const dow=(hoy.getDay()+6)%7, lun=new Date(hoy); lun.setDate(hoy.getDate()-dow);
  const dias=[...Array(7)].map((_,i)=>{ const d=new Date(lun); d.setDate(lun.getDate()+i); return pkFechaLocal(d); });
  return {ini:dias[0], fin:dias[6], dias};
}
// Un picking "General" se reparte en una parte por cooler para poder sumar por bodega.
function pkParts(docs, F){
  const out=[], all=!F||F==="todas";
  docs.forEach(d=>{ const de=d.ubicDestino||d.ubic;
    if(de!==PK_GEN){ if(all||F===de) out.push({...d,_doc:d.id,ubicDestino:de}); return; }
    (d.destinos||[]).forEach(c=>{ if(!all&&F!==c) return;
      const ls=(d.lineas||[]).map(l=>({...l,cantidad:+(l.reparto||{})[c]||0})).filter(l=>l.cantidad>0);
      if(ls.length) out.push({...d,_doc:d.id,ubicDestino:c,lineas:ls,unidades:ls.reduce((a,l)=>a+l.cantidad,0)}); });
  });
  return out;
}
function pkDocs(){
  const r=pkRangoFechas();
  return S.docs.filter(d=>d.tipo==="picking" && d.fecha>=r.ini && d.fecha<=r.fin && (S.pkDestF==="todas" || pkParts([d],S.pkDestF).length))
    .sort((a,b)=>String(b.creado).localeCompare(String(a.creado)));
}

  const lista=docs.map(d=>{ const o=d.ubicOrigen||"repo", de=d.ubicDestino||d.ubic, gen=de===PK_GEN, cs=gen?(d.destinos||[]):[], hora=new Date(d.creado).toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});

      <div style="padding:10px 0 2px"><button class="btn ghost sm" type="button" data-pkprintdoc="${d.id}">🖨 Imprimir esta hoja</button></div></div></details>`; }).join("");

      <h3 class="pk-h">Unidades ${S.pkRango==="hoy"?"de hoy":"por día"}</h3>${chart}</div>

    <div class="card" style="margin-top:14px"><div class="card-h">Pickings registrados<span class="muted" style="font-weight:500;font-size:.85rem">toca uno para ver el detalle</span></div><div class="pk-docs">${lista}</div></div>`;
}
function pkConsolidado(docs){
  const m=new Map();
  docs.forEach(d=>{ const de=d.ubicDestino||d.ubic; (d.lineas||[]).forEach(l=>{ const k=l.productoId||l.nombre;
    const x=m.get(k)||{nombre:l.nombre, codigo:l.codigo, packUn:l.packUn||1, ubicacion:l.ubicacion||"", total:0, por:{}, dia:{}};
    x.total+=+l.cantidad||0; x.por[de]=(x.por[de]||0)+(+l.cantidad||0); x.dia[d.fecha]=(x.dia[d.fecha]||0)+(+l.cantidad||0);
    const p=S.productos.find(p=>p.id===l.productoId); if(p){ x.packUn=p.packUn||x.packUn; x.ubicacion=p.ubicacion||x.ubicacion; }
    m.set(k,x); }); });
  return [...m.values()].sort((a,b)=>(a.ubicacion||"~").localeCompare(b.ubicacion||"~","es",{numeric:true})||a.nombre.localeCompare(b.nombre,"es"));
}

function imprimir(html){

function hojaCab(titulo, sub, extra=""){

function hojaFirmas(){ return `<div class="ph-firmas"><div>Preparó (recolectó)</div><div>Recibió en tránsito</div><div>Observaciones</div></div>`; }
function imprimirHojaPicking(d){
  const o=d.ubicOrigen||"repo", de=d.ubicDestino||d.ubic, gen=de===PK_GEN, cs=gen?(d.destinos||[]):[];
  const ls=[...(d.lineas||[])].map(l=>{ const p=S.productos.find(x=>x.id===l.productoId); return {...l, ubicacion:(p&&p.ubicacion)||l.ubicacion||"", packUn:(p&&p.packUn)||l.packUn||1}; })
    .sort((a,b)=>(a.ubicacion||"~").localeCompare(b.ubicacion||"~","es",{numeric:true})||a.nombre.localeCompare(b.nombre,"es"));
  const un=ls.reduce((a,l)=>a+(+l.cantidad||0),0);
  const destTxt=gen?`General · ${cs.map(c=>bodNom(c)).join(" / ")}`:bodNom(de);
  imprimir(`<section class="ph-doc">${hojaCab("Hoja de recolección · picking", `<b>${esc(d.folio||"BORRADOR")}</b>`, d.folio?"":'<div class="ph-borrador">BORRADOR · aún no confirmado</div>')}
    <div class="ph-ruta"><div><small>Desde</small><b>${esc(bodNom(o))}</b></div><span>→</span><div><small>Hacia</small><b>${esc(destTxt)}</b></div></div>
    <table class="ph-t"><thead><tr><th class="ck"></th><th>Código</th><th>Producto</th><th>Ubic.</th>${gen?cs.map(c=>`<th class="n g">${esc(pkShort({nombre:bodNom(c)}))}</th>`).join(""):""}<th class="n">${gen?"Total un":"Unidades"}</th><th class="n">Packs</th><th class="rec">Recolectado</th></tr></thead>
    <tbody>${ls.map(l=>`<tr><td class="ck"><span class="box"></span></td><td>${esc(l.codigo)}</td><td><b>${esc(l.nombre)}</b></td><td>${esc(l.ubicacion)}</td>${gen?cs.map(c=>`<td class="n g">${(l.reparto||{})[c]?fmt(l.reparto[c]):""}</td>`).join(""):""}<td class="n"><b>${fmt(l.cantidad)}</b></td><td class="n">${l.packUn>1?fmt(Math.round(l.cantidad/l.packUn*100)/100):"-"}</td><td class="rec"></td></tr>`).join("")}</tbody>
    <tfoot><tr><td colspan="${4+cs.length}">${ls.length} producto${ls.length===1?"":"s"}</td><td class="n"><b>${fmt(un)}</b></td><td colspan="2"></td></tr></tfoot></table>${hojaFirmas()}</section>`);
}
function imprimirPickingBorrador(){
  if(!S.pkLineas.length) return;
  const gen=pkGen(), cs=pkCoolers();
  const lineas=S.pkLineas.map(l=>{ const p=S.productos.find(x=>x.id===l.id); if(!p) return null;
    const r={}; if(gen) cs.forEach(c=>{ const n=+(l.por||{})[c.id]||0; if(n>0) r[c.id]=n; });
    return {productoId:p.id, codigo:p.codigo||"", nombre:p.nombre, cantidad:+l.cantidad||0, packUn:p.packUn||1, ubicacion:p.ubicacion||"", ...(gen?{reparto:r}:{})}; }).filter(Boolean);
  imprimirHojaPicking({folio:"", ubicOrigen:S.pkOrig, ubicDestino:S.pkUbic, ...(gen?{destinos:cs.map(c=>c.id)}:{}), lineas});
}
function imprimirConsolidado(){
  const r=pkRangoFechas(), docs=pkDocs(); if(!docs.length) return;
  const semana=r.dias.length>1;
  const uds=d=>d.unidades??(d.lineas||[]).reduce((a,l)=>a+(+l.cantidad||0),0);
  const parts=pkParts(docs,S.pkDestF), destinos=[...new Set(parts.map(d=>d.ubicDestino))];
  const secc=destinos.map(id=>{ const ds=parts.filter(d=>d.ubicDestino===id), cons=pkConsolidado(ds), tot=cons.reduce((a,x)=>a+x.total,0), nd=new Set(ds.map(d=>d._doc)).size;
    return `<section class="ph-bloque"><h2>Hacia ${esc(bodNom(id))} <small>${nd} picking${nd===1?"":"s"} · ${fmt(tot)} unidades</small></h2>
      <table class="ph-t"><thead><tr><th class="ck"></th><th>Código</th><th>Producto</th><th>Ubic.</th>${semana?r.dias.map((f,i)=>`<th class="n d">${DIAS_CORTO[i]}<small>${f.slice(8)}</small></th>`).join(""):""}<th class="n">Total un</th><th class="n">Packs</th><th class="rec">Recolectado</th></tr></thead>
      <tbody>${cons.map(x=>`<tr><td class="ck"><span class="box"></span></td><td>${esc(x.codigo||"")}</td><td><b>${esc(x.nombre)}</b></td><td>${esc(x.ubicacion)}</td>${semana?r.dias.map(f=>`<td class="n d">${x.dia[f]?fmt(x.dia[f]):""}</td>`).join(""):""}<td class="n"><b>${fmt(x.total)}</b></td><td class="n">${x.packUn>1?fmt(Math.round(x.total/x.packUn*100)/100):"-"}</td><td class="rec"></td></tr>`).join("")}</tbody></table></section>`; }).join("");
  imprimir(`<section class="ph-doc ${semana?"ph-wide":""}">${hojaCab(`Consolidado de picking · ${semana?"semana":"día"}`, `<b>${fFecha(r.ini)}${semana?" al "+fFecha(r.fin):""}</b>`, `<div>${docs.length} pickings · ${fmt(parts.reduce((a,d)=>a+uds(d),0))} unidades</div>`)}${secc}${hojaFirmas()}</section>`);
}

function openMenu(btn){

    if(nuevo===PK_GEN && antes!==PK_GEN){ const c0=pkCoolers()[0]; S.pkLineas.forEach(l=>{ l.por=c0&&+l.cantidad>0?{[c0.id]:String(l.cantidad)}:{}; }); }
    if(nuevo!==PK_GEN && antes===PK_GEN) S.pkLineas.forEach(l=>{ delete l.por; });

  const km=t.closest("[data-dmenu]"); if(km){ e.stopPropagation(); return pop.classList.contains("open")&&pop._btn===km ? closeMenu() : openMenu(km); }
  const so=t.closest("[data-sort]"); if(so){ const k=so.dataset.sort; S.sort = S.sort.k===k ? {k, dir:-S.sort.dir} : {k, dir:1}; S.page=1; render(); $(`[data-sort="${k}"]`)?.focus(); return; }
  const pg=t.closest("[data-page]"); if(pg && !pg.disabled){ S.page=+pg.dataset.page; S.open=null; render(); return; }
  const dp=t.closest("[data-delp]"); if(dp){ const p=S.productos.find(x=>x.id===dp.dataset.delp);
    if(p && confirm(`¿Eliminar "${p.nombre}"? Su historial de movimientos se mantiene.`)){ S.open=null; S.sel.delete(p.id); Store.delProducto(p.id).then(()=>toast("Producto eliminado")).catch(()=>toast("No se pudo eliminar. Inténtalo de nuevo.")); } return; }
  const bk=t.closest("[data-bulk]"); if(bk){ const k=bk.dataset.bulk, ids=[...S.sel].filter(id=>S.productos.some(p=>p.id===id));
    if(k==="clear"){ S.sel.clear(); render(); return; }
    if(k==="export") return exportar(S.productos.filter(p=>S.sel.has(p.id)));
    S.sel.clear(); return nuevoForm(k, ids); }
  const op=t.closest("[data-open]"); if(op){ S.open = S.open===op.dataset.open ? null : op.dataset.open; S.saved=null; render(); return; }
  if(t.closest("[data-add]")) return openProd();
  if(t.closest("[data-imp]")) return $("#file").click();
  if(t.closest("[data-addbod]")) return openBod();
  const ebod=t.closest("[data-editbod]"); if(ebod) return openBod(ebod.dataset.editbod);
  const row=t.closest("tr[data-row]"); if(row && !t.closest("button,input,label,a,select")){ S.open = S.open===row.dataset.row ? null : row.dataset.row; S.saved=null; render(); }
});
let tIn;
C.addEventListener("input",e=>{
  const t=e.target, id=t.id, v=t.value;
  if(S.form){
    if(t.dataset.ff){ S.form[t.dataset.ff]=v; return; }
    if(t.dataset.lq!==undefined){ S.form.lineas[+t.dataset.lq].cantidad=v; updLinea(+t.dataset.lq); return; }
    if(t.dataset.lv!==undefined){ S.form.lineas[+t.dataset.lv].venc=v; return; }
    if(id==="pick"){ S.form.pq=v; showSugs(); return; }
  }
  if(t.dataset.pkq!==undefined){ const l=S.pkLineas[+t.dataset.pkq];
    if(t.dataset.pkd){ l.por=l.por||{}; l.por[t.dataset.pkd]=v; pkSetGen(l); } else l.cantidad=v;
    updPkLinea(+t.dataset.pkq); return; }
  if(id==="pkPick"){ S.pkq=v; $("#pkTiles").innerHTML=pkTiles(); return; }
  if(!["fq","mq","dq"].includes(id)) return;
  clearTimeout(tIn); tIn=setTimeout(()=>{ if(id==="fq"){ S.q=v; S.open=null; } if(id==="mq") S.mq=v; if(id==="dq") S.dq=v; S.page=1; render(); },200);
});
C.addEventListener("keydown",e=>{
  const t=e.target;
  if(t.id==="pick"){
    const box=$("#sugs"), items=box?[...box.querySelectorAll("[data-pick]")]:[], hi=items.findIndex(x=>x.classList.contains("hl"));
    if(e.key==="Enter"){ e.preventDefault(); const r=buscarProd(t.value); const sel=items[hi]?.dataset.pick || (r[0]&&r[0].id);
      if(sel) addLinea(sel); else if(t.value.trim()){ S.form.err=`No existe un producto con "${t.value.trim()}". Créalo primero en Productos.`; render(true); } }
    if((e.key==="ArrowDown"||e.key==="ArrowUp") && items.length){ e.preventDefault(); const n=(hi+(e.key==="ArrowDown"?1:-1)+items.length)%items.length; items.forEach((x,i)=>x.classList.toggle("hl",i===n)); items[n].scrollIntoView({block:"nearest"}); }
    if(e.key==="Escape") box?.classList.remove("open");
  }
  if(t.dataset && t.dataset.lq!==undefined && e.key==="Enter"){ e.preventDefault(); $("#pick")?.focus(); }
  if(t.dataset && t.dataset.ef!==undefined && e.key==="Escape"){ S.open=null; render(true); }
  if(t.id==="pkPick" && e.key==="Enter"){ e.preventDefault(); const r=buscarProd(t.value).filter(p=>(p.ubic[S.pkOrig]||0)>0);
    if(r[0]){ S.pkq=""; addLineaPk(r[0].id); } else if(t.value.trim()){ S.pkErr=`No hay stock de "${t.value.trim()}" en ${bodNom(S.pkOrig)}.`; render(true); } }
  if(t.dataset && t.dataset.pkq!==undefined && e.key==="Enter"){ e.preventDefault(); $("#pkPick")?.focus(); }
});
C.addEventListener("change",e=>{
  const t=e.target, id=t.id, v=t.value;
  if(S.form && t.dataset.ff){ S.form[t.dataset.ff]=v; if(t.dataset.ff==="bod") render(true); return; }
  if(t.dataset.ef!==undefined) return saveInline(t);
  if(t.dataset.effoto!==undefined) return cambiarFotoInline(t.dataset.effoto, t.files[0]);
  if(t.dataset.sel!==undefined){ t.checked?S.sel.add(t.dataset.sel):S.sel.delete(t.dataset.sel); render(); return; }
  if(t.hasAttribute("data-selall")){ const ids=[...C.querySelectorAll("[data-sel]")].map(x=>x.dataset.sel); ids.forEach(i=>t.checked?S.sel.add(i):S.sel.delete(i)); render(); return; }
  if(id==="fcat"){ S.cat=v; S.bod="todas"; S.open=null; }
  else if(id==="fbod"){ S.bod=v; S.open=null; }
  else if(id==="psize"){ S.size=+v; }
  else return;
  S.page=1; render();
});
// Si escriben un año de 1-3 dígitos en un <input type=date> (ej. "27" en vez de "2027"),
// el navegador lo guarda literal como año 0027. Lo corregimos antes de que cualquier otro
// listener lea el valor (capture:true corre primero) y avisamos con un "input" sintético
// para que los listeners que escuchan "input" (líneas de recepción, etc.) tomen el valor ya corregido.
document.addEventListener("change", e=>{
  const el=e.target;
  if(el.tagName==="INPUT" && el.type==="date" && el.value){
    const m=el.value.match(/^(\d{1,4})-(\d{2})-(\d{2})$/);
    if(m && +m[1]<100){ el.value=`${2000+ +m[1]}-${m[2]}-${m[3]}`; el.dispatchEvent(new Event("input",{bubbles:true})); }
  }
}, true);
Store.init();
</script>
